# Full config per docs/data-platform/reference/generator_design.md, section 10.
seed: 42
scale:
  n_skus: 2000
  start_date: 2026-01-01     # simulated day 1
  days_history: 180          # from day 1 to cutoff
  days_stream: 30            # sau cutoff
  orders_per_day: 4000
  sku_zipf_exponent: 0.8     # the best-selling SKU is about 5% of Order Lines (with 2,000 SKUs)
storefront_weights:          # skew by Storefront, must sum to 1
  amazon_us: 0.45
  tiktok_shop_us: 0.15
  amazon_uk: 0.12
  amazon_de: 0.10
  shopify: 0.08
  walmart_us: 0.07
  shopee_vn: 0.03
labels:
  window_days: 30
offline_problems:
  duplicate_rate: 0.02
  overlap_days: 3
  amazon_orders_api_switch_day: 100    # from this day Amazon records under Orders 2026-01-01
storage:
  output_root: ./out/default
streaming_problems:
  pacing:
    default_seconds_per_sim_day: 60
    segments:
      - {from_day: 195, to_day: 195, seconds_per_sim_day: 600}   # livestream day replayed slowly to make the burst visible
  duplicate_rate: {tiktok_shop_us: 0.015}
  amazon_late: {median_minutes: 5, share_over_1h: 0.05}
drift:
  tiktok_live: {day: 195, start_hour_utc: 12, duration_hours: 6, burst_multiplier: [5, 8]}
  prime_day:                 # Sale Event on the Amazon Storefronts (covariate drift)
    day: 120
    days: 2
    order_multiplier: 4      # Amazon Order count is 4x a normal day
    discount_share: 0.7      # 70% of Amazon Order Lines are discounted
    deal_skus: 50            # number of SKUs promoted on the sale day
