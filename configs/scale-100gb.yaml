# Config that reaches the dataset's 100 GB raw threshold. Same as `default.yaml` except in two places:
# `orders_per_day` and `storage.output_root`.
#
# Why 851,506: the threshold is measured as the sum of `datasets[*].bytes` in `run_manifest.json`
# (raw bytes of the raw batch data). The factor is NOT derived from `default.yaml` but measured with a
# trial run of 40,000 Orders/day (x10): it produced 4,697,556,950 bytes, so
# 100.0 GB / 4,697,556,950 x 40,000 = 851,506. The trial run also confirmed that the manifest total
# equals the actual bytes on disk (see `tests/unit/generator/test_generate_order_snapshots.py`).
#
# Why decimal 100.0 GB and not 100 GiB: `/data` has 98 GiB usable.
# 100 GiB does not fit; 100.0 GB = 93.1 GiB fits with ~5 GiB to spare.
#
# Measured from the x10 trial run (546.7 seconds, peak RAM 472 MB): ~3.2 hours on 1 core.
# Peak RAM falls on Prime Day (day 120, Amazon orders x4), not on a normal day.
seed: 42
scale:
  n_skus: 2000
  start_date: 2026-01-01     # simulated day 1
  days_history: 180          # from day 1 to cutoff
  days_stream: 30            # sau cutoff
  orders_per_day: 851506
  sku_zipf_exponent: 0.8     # the best-selling SKU is about 5% of Order Lines (with 2,000 SKUs)
storefront_weights:          # skew by Storefront, must sum to 1
  amazon_us: 0.45
  tiktok_shop_us: 0.15
  amazon_uk: 0.12
  amazon_de: 0.10
  shopify: 0.08
  walmart_us: 0.07
  shopee_vn: 0.03
labels:
  window_days: 30
offline_problems:
  duplicate_rate: 0.02
  overlap_days: 3
  amazon_orders_api_switch_day: 100    # from this day Amazon records under Orders 2026-01-01
storage:
  output_root: /data/raw
streaming_problems:
  pacing:
    default_seconds_per_sim_day: 60
    segments:
      - {from_day: 195, to_day: 195, seconds_per_sim_day: 600}   # livestream day replayed slowly to make the burst visible
  duplicate_rate: {tiktok_shop_us: 0.015}
  amazon_late: {median_minutes: 5, share_over_1h: 0.05}
drift:
  tiktok_live: {day: 195, start_hour_utc: 12, duration_hours: 6, burst_multiplier: [5, 8]}
  prime_day:                 # Sale Event on the Amazon Storefronts (covariate drift)
    day: 120
    days: 2
    order_multiplier: 4      # Amazon Order count is 4x a normal day
    discount_share: 0.7      # 70% of Amazon Order Lines are discounted
    deal_skus: 50            # number of SKUs promoted on the sale day
