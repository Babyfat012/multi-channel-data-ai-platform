# Jenkins configuration as code (JCasC). Secrets are NOT here: they come from environment variables that
# scripts/shared/setup_jenkins.py reads from Vault at startup.
jenkins:
  systemMessage: "Platform CI/CD (local). Application secrets live in Vault; Jenkins only holds a read-only token."
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: vault-ci-token
              description: Read-only Vault token (policy platform-read)
              secret: "${VAULT_CI_TOKEN}"
          - file:
              scope: GLOBAL
              id: kind-kubeconfig
              fileName: kubeconfig
              secretBytes: "${base64:${readFile:/run/secrets/kubeconfig}}"
unclassified:
  location:
    url: "http://localhost:8090/"
jobs:
  # Each infra/jenkins/<name>.Jenkinsfile becomes a pipeline job, pulling code from the git repo (main branch) ⇒ CI
  # runs exactly the committed code, not the working tree. Remote: CI_GIT_REMOTE (EC2: the public GitHub repo,
  # docker-compose.aws.yml), else the read-only mounted local repo.
  # Only `ci` polls (diagram D1 → D2): every commit runs the tests. Deploy jobs stay manual (no staging/approval yet).
  - script: |
      ['ci', 'feature-repo', 'stream-features', 'feature-api-agents', 'coordinator', 'rag-pipeline', 'return-risk', 'llm-serving'].each { name ->
        pipelineJob(name) {
          if (name == 'ci') {
            properties { pipelineTriggers { triggers { pollSCM { scmpoll_spec('H/5 * * * *') } } } }
          }
          definition {
            cpsScm {
              scm { git { remote { url('${CI_GIT_REMOTE:-file:///repo}') }; branch('*/main') } }
              scriptPath('infra/jenkins/' + name + '.Jenkinsfile')  // string concatenation: JCasC substitutes every dollar-brace variable before Groovy ⇒ empty
            }
          }
        }
      }
