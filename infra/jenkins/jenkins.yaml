# Jenkins configuration as code (JCasC). Secrets are NOT here: they come from environment variables that
# scripts/setup/setup_jenkins.sh reads from Vault at startup.
jenkins:
  systemMessage: "Platform CI/CD (local). Application secrets live in Vault; Jenkins only holds a read-only token."
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: vault-ci-token
              description: Read-only Vault token (policy platform-read)
              secret: "${VAULT_CI_TOKEN}"
          - file:
              scope: GLOBAL
              id: kind-kubeconfig
              fileName: kubeconfig
              secretBytes: "${base64:${readFile:/run/secrets/kubeconfig}}"
unclassified:
  location:
    url: "http://localhost:8090/"
jobs:
  # Each ci/jenkins/<name>.Jenkinsfile becomes a pipeline job, pulling code from the git repo (main branch) ⇒ CI
  # runs exactly the committed code, not the working tree.
  - script: |
      ['stream-features', 'feature-api-agents', 'coordinator', 'rag-pipeline'].each { name ->
        pipelineJob(name) {
          definition {
            cpsScm {
              scm { git { remote { url('${CI_GIT_REMOTE:-file:///repo}') }; branch('*/main') } }
              scriptPath('ci/jenkins/' + name + '.Jenkinsfile')  // string concatenation: JCasC substitutes every dollar-brace variable before Groovy ⇒ empty
            }
          }
        }
      }
