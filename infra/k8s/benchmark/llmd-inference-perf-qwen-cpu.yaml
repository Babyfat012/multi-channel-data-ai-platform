# llm-d-benchmark workload (inference-perf harness) for llama.cpp Qwen2.5-1.5B on CPU on EKS.
# Based on llm-d-benchmark's workload/profiles/inference-perf/sanity_random.yaml.in, scaled down for CPU (~16 tokens/s):
# 3 load levels 0.1 / 0.2 / 0.4 requests/s, prompt ~128 tokens, ~32 generated tokens. Completion API + streaming ⇒ TTFT available.
# model_name/base_url hard-coded (not relying on llm-d-benchmark's REPLACE_ENV): llama.cpp `--alias` and Service `qwen.llm`.
# tokenizer is the matching Hugging Face id, used only for token counting (the harness pod needs Internet access, or set HF_TOKEN).
load:
  type: constant
  stages:
  - rate: 0.1
    duration: 60
  - rate: 0.2
    duration: 60
  - rate: 0.4
    duration: 60
  request_timeout: 120
  num_workers: 2
api:
  type: completion
  streaming: true
server:
  type: vllm            # inference-perf calls OpenAI-style /v1/completions; llama.cpp server speaks the same protocol
  model_name: qwen2.5-1.5b-instruct
  base_url: http://qwen.llm.svc.cluster.local:8080
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
data:
  type: random
  input_distribution:
    min: 64
    max: 256
    mean: 128
    std_dev: 10
    total_count: 100
  output_distribution:
    min: 16
    max: 48
    mean: 32
    std_dev: 5
    total_count: 100
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
