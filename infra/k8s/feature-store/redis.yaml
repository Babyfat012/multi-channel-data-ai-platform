# Feast online store. A replacement pod reuses the PVC and replays the AOF to recover.
apiVersion: v1
kind: Namespace
metadata:
  name: feature-store
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: feature-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: feature-store
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - --save
            - ""
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports: [{containerPort: 6379}]
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 320Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
# NodePort 30379: Airflow in Compose calls platform-control-plane:30379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: feature-store
spec:
  type: NodePort
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
