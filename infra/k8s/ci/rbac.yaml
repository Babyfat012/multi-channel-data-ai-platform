# RBAC for Jenkins on EC2 (group `platform-ci` from the EKS access entry, infra/aws/kubernetes/cluster.tf).
# Full access ONLY in the namespaces CI deploys to (kagent: Agent/ModelConfig are CRDs; feature-store: Feature API helm;
# agentgateway: smoke pod; langfuse: port-forward to read prompts). Outside those, only Namespace read (the deploy script's kubectl apply
# reads the namespace first). Admin applies once: kubectl --context platform-apps apply -f infra/k8s/ci/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-ci-read-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-ci-read-namespaces
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: platform-ci-read-namespaces}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: platform-ci}]
---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ci-deployer
  namespace: kagent
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ci-deployer
  namespace: kagent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ci-deployer}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: platform-ci}]
---
