# KServe InferenceService return-risk (RawDeployment, model-inside-image).
# Image và version do scripts/run/deploy_return_risk.sh điền (@@IMAGE@@, @@VERSION@@).
apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
# Pod Identity (EKS) gắn quyền đọc S3 feature-store vào account này; kind không dùng tới.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: return-risk
  namespace: ml-serving
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: return-risk
  namespace: ml-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # prometheus-server kéo /metrics (độ trễ KServe + metric nghiệp vụ return_risk_*). Khai thẳng cổng
    # 8080: cờ enable-prometheus-scraping của KServe trỏ 9091 (sidecar gộp metric, RawDeployment không có).
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
    # KServe không tự tạo HPA (EKS không có metrics-server cho HPA CPU); KEDA bên dưới scale theo số dự đoán.
    serving.kserve.io/autoscalerClass: external
  labels:
    model-version: "@@VERSION@@"
spec:
  predictor:
    serviceAccountName: return-risk
    minReplicas: 2   # multi-replica: một pod chết vẫn còn pod trả dự đoán cho Model Agent
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: "@@IMAGE@@"
        imagePullPolicy: IfNotPresent
        args: ["--model_name", "return-risk", "--http_port", "8080"]
        env:
          - {name: MIN_HISTORY, value: "20"}
          - {name: FEAST_REDIS, value: "redis.feature-store.svc.cluster.local:6379"}
          # Script deploy điền: kind = s3://platform/feature-store (MinIO), EKS = S3 lakehouse.
          - {name: FEAST_REGISTRY, value: "@@FEAST_ROOT@@/registry.db"}
          - {name: FEAST_PUBLICATION_ROOT, value: "@@FEAST_ROOT@@/publications"}
          - {name: FEAST_SKU_DAILY_PATH, value: "@@FEAST_ROOT@@/sku_daily"}
          - {name: FEAST_SKU_RETURN_24H_PATH, value: "@@FEAST_ROOT@@/sku_return_24h.parquet"}
          - {name: AWS_REGION, value: "@@AWS_REGION@@"}
        envFrom:
          # kind: key + endpoint MinIO; EKS không có Secret này, S3 qua Pod Identity.
          - secretRef: {name: platform-minio, optional: true}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
---
# Autoscale predictor theo tải thật: tốc độ dự đoán (metric nghiệp vụ return_risk_predictions_total), cùng cách với Agent.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: return-risk-predictor
  namespace: ml-serving
spec:
  scaleTargetRef:
    name: return-risk-predictor   # Deployment KServe RawDeployment tạo: <isvc>-predictor
  minReplicaCount: 2
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        query: sum(rate(return_risk_predictions_total{namespace="ml-serving"}[1m]))
        threshold: "5"   # dự đoán/giây mỗi pod
