# KServe InferenceService return-risk (RawDeployment, model-inside-image).
# Image and version filled in by scripts/run/deploy_return_risk.sh (@@IMAGE@@, @@VERSION@@).
apiVersion: v1
kind: Namespace
metadata:
  name: ml-serving
---
# Pod Identity (EKS) grants S3 feature-store read access to this account; unused on kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: return-risk
  namespace: ml-serving
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: return-risk
  namespace: ml-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # prometheus-server scrapes /metrics (KServe latency + return_risk_* business metrics). Port 8080 declared
    # explicitly: KServe's enable-prometheus-scraping flag points at 9091 (metric-aggregation sidecar, absent in RawDeployment).
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
    # KServe does not create an HPA itself (EKS has no metrics-server for CPU HPA); KEDA below scales on prediction count.
    serving.kserve.io/autoscalerClass: external
  labels:
    model-version: "@@VERSION@@"
spec:
  predictor:
    serviceAccountName: return-risk
    minReplicas: 2   # multi-replica: if one pod dies another still serves predictions to the Model Agent
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: "@@IMAGE@@"
        imagePullPolicy: IfNotPresent
        args: ["--model_name", "return-risk", "--http_port", "8080"]
        env:
          - {name: MIN_HISTORY, value: "20"}
          - {name: FEAST_REDIS, value: "redis.feature-store.svc.cluster.local:6379"}
          # Filled in by the deploy script: kind = s3://platform/feature-store (MinIO), EKS = S3 lakehouse.
          - {name: FEAST_REGISTRY, value: "@@FEAST_ROOT@@/registry.db"}
          - {name: FEAST_PUBLICATION_ROOT, value: "@@FEAST_ROOT@@/publications"}
          - {name: FEAST_SKU_DAILY_PATH, value: "@@FEAST_ROOT@@/sku_daily"}
          - {name: FEAST_SKU_RETURN_24H_PATH, value: "@@FEAST_ROOT@@/sku_return_24h/"}
          - {name: AWS_REGION, value: "@@AWS_REGION@@"}
        envFrom:
          # kind: MinIO key + endpoint; EKS has no such Secret, S3 via Pod Identity.
          - secretRef: {name: platform-minio, optional: true}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
---
# Autoscale the predictor on real load: prediction rate (business metric return_risk_predictions_total), same approach as the Agents.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: return-risk-predictor
  namespace: ml-serving
spec:
  scaleTargetRef:
    name: return-risk-predictor   # Deployment created by KServe RawDeployment: <isvc>-predictor
  minReplicaCount: 2
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        query: sum(rate(return_risk_predictions_total{namespace="ml-serving"}[1m]))
        threshold: "5"   # predictions/s per pod
