# Data drift check on AWS (Evidently) for the return-risk model inputs on pipeline A training_lines in S3.
# Runs in ns kubeflow as SA pipeline-runner (Pod Identity READ-only on feature-store/*), no keys.
# Code loaded from ConfigMap `drift-code` (built from ml/drift.py, see the runbook); result = summary JSON in the Job log.
# The pod stays 15 extra minutes after finishing to fetch the Evidently HTML: kubectl -n kubeflow cp <pod>:/tmp/drift ./drift-eks (see docs/ml-llm-platform/drift_monitoring.md).
# @@LAKEHOUSE_BUCKET@@ / @@AWS_REGION@@ filled in at apply time (sed).
apiVersion: batch/v1
kind: Job
metadata:
  name: mle-drift
  namespace: kubeflow
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: pipeline-runner
      restartPolicy: Never
      containers:
        - name: drift
          image: python:3.12-slim
          command: ["sh", "-c"]
          # pandas 3 dropped infer_dtype_from_object which Evidently 0.7 needs ⇒ pin pandas 2.
          args:
            - pip install --quiet --no-cache-dir "evidently==0.7.23" "pandas==2.3.3" "s3fs==2026.9.0" pyarrow
              && cd /work && python -m ml.drift --reference "s3://@@LAKEHOUSE_BUCKET@@/feature-store/training_lines"
              --reference-days 30 --shift-channel shopee --out /tmp/drift
              && echo "HTML in /tmp/drift; keeping pod 15 minutes for kubectl cp" && sleep 900
          env:
            - {name: AWS_REGION, value: "@@AWS_REGION@@"}
            - {name: AWS_DEFAULT_REGION, value: "@@AWS_REGION@@"}
          volumeMounts:
            - {name: code, mountPath: /work/ml}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 3Gi}
      volumes:
        - name: code
          configMap:
            name: drift-code
            items:
              - {key: drift.py, path: drift.py}
              - {key: init, path: __init__.py}
