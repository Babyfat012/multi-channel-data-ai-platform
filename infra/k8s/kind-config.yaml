# Local k8s cluster for the ML Platform (1 node, default node image of the installed kind). Node name: platform-control-plane.
# Airflow/Spark in Compose call in via NodePort after the node is joined to the platform_default network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform
# Local registry (scripts/setup/setup_kind_registry.sh): containerd reads hosts.toml in certs.d.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
