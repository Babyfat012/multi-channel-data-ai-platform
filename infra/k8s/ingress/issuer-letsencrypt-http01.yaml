# Let's Encrypt production, solving HTTP-01 through the nginx ingress itself (needs a domain pointing at the NLB, port 80 open).
# Rendered by setup_ingress.sh when INGRESS_ISSUER=platform-letsencrypt; email filled in at run time.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "@@LE_EMAIL@@"
    privateKeySecretRef:
      name: platform-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
