# Agent chat UI (kagent UI) behind the gateway: HTTPS + basic auth + rate limit.
# htpasswd Secret `agent-ui-basic-auth` is created by scripts/setup/setup_ingress.sh from the password in Vault.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-ui
  namespace: kagent
  annotations:
    cert-manager.io/cluster-issuer: platform-local-ca
    # HTTP-01 challenge path attached to this same Ingress (F5 NGINX rejects a second Ingress with the same host).
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/basic-auth-secret: agent-ui-basic-auth
    nginx.org/basic-auth-realm: "PLATFORM agent UI"
    # 5 requests/s per IP, beyond burst returns 429.
    nginx.org/limit-req-rate: "5r/s"
    nginx.org/limit-req-burst: "10"
    nginx.org/limit-req-reject-code: "429"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["agent.@@NODE_IP_DASH@@.sslip.io"]
      secretName: agent-ui-tls
  rules:
    - host: agent.@@NODE_IP_DASH@@.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: kagent-ui, port: {number: 8080}}}
