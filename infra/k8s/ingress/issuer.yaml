# Internal CA for local HTTPS: self-signed → CA cert (10 years) → ClusterIssuer `platform-local-ca`.
# On GKE with a real domain, replace with an ACME ClusterIssuer (Let's Encrypt).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: selfsigned}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: platform-local-ca, namespace: cert-manager}
spec:
  isCA: true
  commonName: PLATFORM Local CA
  secretName: platform-local-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: platform-local-ca}
spec: {ca: {secretName: platform-local-ca}}
