# Feature-pull Web API: HTTPS via NGINX Ingress, cert issued by cert-manager.
# sslip.io host points at the kind node IP (@@NODE_IP_DASH@@ filled in by scripts/setup/setup_ingress.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feature-api
  namespace: feature-store
  annotations:
    cert-manager.io/cluster-issuer: platform-local-ca
    # HTTP-01 challenge path attached to this same Ingress (F5 NGINX rejects a second Ingress with the same host).
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/limit-req-rate: "50r/s"
    nginx.org/limit-req-burst: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.@@NODE_IP_DASH@@.sslip.io"]
      secretName: feature-api-tls
  rules:
    - host: api.@@NODE_IP_DASH@@.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: feature-api, port: {number: 8000}}}
