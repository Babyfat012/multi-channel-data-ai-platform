# Ops UIs behind the gateway: metrics/logs (Grafana), traces (Jaeger), agent registry.
# Each route: HTTPS + basic auth (secret `ops-basic-auth` in the same namespace). @@NS@@/@@SVC@@/@@PORT@@/@@HOST@@
# are filled in by scripts/setup/setup_ingress.sh, only when the service already exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: @@NAME@@
  namespace: @@NS@@
  annotations:
    cert-manager.io/cluster-issuer: platform-local-ca
    # HTTP-01 challenge path attached to this same Ingress (F5 NGINX rejects a second Ingress with the same host).
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/basic-auth-secret: ops-basic-auth
    nginx.org/basic-auth-realm: "PLATFORM ops"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["@@HOST@@"]
      secretName: @@NAME@@-tls
  rules:
    - host: @@HOST@@
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: @@SVC@@, port: {number: @@PORT@@}}}
