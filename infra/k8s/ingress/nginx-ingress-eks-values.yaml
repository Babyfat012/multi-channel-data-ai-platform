# F5 NGINX Ingress Controller (chart nginx-ingress 2.7.3) on EKS: Service LoadBalancer = public NLB
# (fixed IP ⇒ use <ip>.sslip.io as the domain). Public subnets are already tagged kubernetes.io/role/elb=1.
controller:
  ingressClass:
    name: nginx
    setAsDefaultIngress: true
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
