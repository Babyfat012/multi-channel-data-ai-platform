# Community DuckDNS webhook: https://github.com/ebrianne/cert-manager-webhook-duckdns
# Rendered by setup_letsencrypt.sh; staging by default, prod only when LE_ENV=production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-letsencrypt-@@LE_ENV@@
spec:
  acme:
    server: "@@ACME_SERVER@@"
    email: "@@LE_EMAIL@@"
    privateKeySecretRef:
      name: platform-letsencrypt-@@LE_ENV@@-account
    solvers:
      - selector:
          dnsZones: ["@@DUCKDNS_DOMAIN@@"]
        dns01:
          webhook:
            groupName: acme.platform.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: duckdns-token
                key: token
