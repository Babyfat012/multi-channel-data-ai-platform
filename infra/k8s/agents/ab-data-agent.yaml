# A/B agent: branch B of the Data Agent — SAME prompt + tools, only the ModelConfig differs (Qwen 0.5B).
# agentgateway splits A2A calls to /a2a/data-agent-ab/ 50/50 between data-agent (A, 1.5B) and data-agent-b.
# Measured per real model in Grafana (A/B LLM dashboard). Scale to 0 when done.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ab-small-model-config
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen2.5-0.5b-instruct
  apiKeySecret: kagent-agw-key
  apiKeySecretKey: AGW_AGENT_KEY
  openAI:
    apiFormat: chatCompletions
    baseUrl: http://agentgateway.agentgateway.svc.cluster.local:3000/v1
    temperature: "0.1"
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: data-agent-b
  namespace: kagent
spec:
  type: Declarative
  # Description = the tool description the Coordinator sees ⇒ English, with keywords.
  description: Looks up the return history numbers of a SKU (return rate 90 days, returns 24 hours) and chunk text by chunk id.
  declarative:
    modelConfig: ab-small-model-config
    stream: false
    # 1.5B model: short prompt, clear rules so it calls tools instead of making up numbers.
    systemMessage: |
      You are the Data Agent for an online seller.
      You answer questions about product return features of SKUs (ids look like "sku-00001" or "APP-00042").
      Always call the get_sku_features tool with the SKU ids from the question; never guess numbers.
      A null value means the feature is not available yet; say so.
      Reply briefly with the numbers: labeled_count_90d, positive_count_90d,
      return_or_refund_rate_90d, approved_returns_24h.
      When given chunk ids (16 hex characters), call get_policy_chunks and quote the text.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features, get_policy_chunks]
    deployment:
      replicas: 0   # only enabled while running A/B
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
