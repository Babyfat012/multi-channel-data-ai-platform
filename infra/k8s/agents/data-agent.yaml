# Agent 1 (Data Agent): pulls data from the Online Feature Store by ID via MCP tools: features by SKU
# (`get_sku_features`) and policy chunks by chunk_id (`get_policy_chunks`).
# Tools go through agentgateway (/mcp, API key required), never calling the Feature API directly; model uses default-model-config.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: feature-tools
  namespace: kagent
spec:
  description: Per-SKU return rate features (Feast online store), via agentgateway
  protocol: STREAMABLE_HTTP
  url: http://agentgateway.agentgateway.svc.cluster.local:3000/mcp
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: kagent-agw-key, key: AUTH_HEADER}
  timeout: 30s
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: data-agent
  namespace: kagent
spec:
  type: Declarative
  # Description = the tool description the Coordinator sees ⇒ English, with keywords.
  description: Looks up the return history numbers of a SKU (return rate 90 days, returns 24 hours) and chunk text by chunk id.
  declarative:
    modelConfig: default-model-config
    stream: false
    # System prompt managed in Langfuse (prompt platform-data-agent, label production); scripts/setup/sync_agent_prompts.py
    # pushes the production version into ConfigMap agent-prompts. Initial seed: infra/k8s/agents/prompts/data-agent.txt.
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: data-agent}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features, get_policy_chunks]
    deployment:
      # No `replicas`: the replica count is decided by KEDA (data-agent-keda.yaml).
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
      # Prefer spreading replicas across workers: one dead node still leaves a running copy. 'preferred' so a 1-node kind still runs.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {kagent: data-agent}}
