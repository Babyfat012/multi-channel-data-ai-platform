# Langfuse v2 (prompt management): Agent system prompts live here, versioned + `production` label.
# v2 only needs Postgres (uses the `langfuse` database on pgvector, ns rag); v3+ also needs ClickHouse/Redis/S3.
# Secret langfuse-env (DATABASE_URL, keys, initial account) is created by scripts/setup/deploy_kind_langfuse.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: langfuse
spec:
  replicas: 1
  strategy: {type: Recreate}   # Prisma migrations run at startup: never let 2 pods migrate at the same time
  selector:
    matchLabels: {app: langfuse}
  template:
    metadata:
      labels: {app: langfuse}
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:2.95.11
          envFrom: [{secretRef: {name: langfuse-env}}]
          env:
            - {name: NEXTAUTH_URL, value: "http://langfuse.langfuse.svc.cluster.local:3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: TELEMETRY_ENABLED, value: "false"}
            - {name: LANGFUSE_INIT_ORG_ID, value: platform}
            - {name: LANGFUSE_INIT_ORG_NAME, value: PLATFORM}
            - {name: LANGFUSE_INIT_PROJECT_ID, value: platform-agents}
            - {name: LANGFUSE_INIT_PROJECT_NAME, value: PLATFORM Agents}
            - {name: LANGFUSE_INIT_USER_NAME, value: admin}
          ports: [{name: http, containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /api/public/health, port: http}
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: langfuse
spec:
  selector: {app: langfuse}
  ports: [{name: http, port: 3000, targetPort: http}]
