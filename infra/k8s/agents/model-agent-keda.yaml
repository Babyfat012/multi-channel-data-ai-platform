# Autoscale the Model Agent with KEDA on real A2A load: request rate into agentgateway route a2a-model-agent (+ -path for external clients)
# (Prometheus). Minimum 2 replicas (multi-replica), maximum 3; each replica handles ~0.5 requests/s.
# The Agent does not declare `replicas`, so kagent does not fight the KEDA-created HPA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: model-agent
  namespace: kagent
spec:
  scaleTargetRef:
    name: model-agent
  minReplicaCount: 2
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        query: sum(rate(agentgateway_requests_total{route=~"default/a2a-model-agent(-path)?"}[1m]))
        threshold: "0.5"
