# Model Agent (Agent 2) running in a gVisor sandbox (Agent Substrate): same model (via agentgateway), same system prompt
# and the same three MCP tools as model-agent (features, prediction via KServe, RAG), but the Agent code never touches the node kernel.
# Substrate only supports the Go runtime (not ADK Python yet), like data-agent-sandbox.
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: model-agent-sandbox
  namespace: kagent
spec:
  type: Declarative
  description: Model Agent in a gVisor sandbox; scores return risk and answers policy questions through the gateway MCP tools.
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: model-agent}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features, predict_return_risk, search_policy_chunks]
  substrate:
    workerPoolRef: {name: kagent-default}
