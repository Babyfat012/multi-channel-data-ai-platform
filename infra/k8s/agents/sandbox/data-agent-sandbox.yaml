# Data Agent running in a gVisor sandbox (Agent Substrate): same model (via agentgateway) and same MCP tools as
# data-agent, but the Agent code never touches the node kernel. Substrate only supports the Go runtime (not ADK Python yet).
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: data-agent-sandbox
  namespace: kagent
spec:
  type: Declarative
  description: Data Agent in a gVisor sandbox; looks up SKU return features through the gateway MCP tools.
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: data-agent}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features]
  substrate:
    workerPoolRef: {name: kagent-default}
