# Coordinator Agent: receives Seller questions and delegates to the Data Agent or the Model Agent (Agent-as-tool, A2A).
# kagent `proxy.url` = agentgateway ⇒ A2A calls go through the gateway (routed by header x-kagent-host), with an API key.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: coordinator
  namespace: kagent
spec:
  type: Declarative
  description: Routes Seller questions to the Data Agent (features, chunks) or the Model Agent (predictions, policy).
  declarative:
    modelConfig: default-model-config
    stream: false
    # System prompt managed in Langfuse (prompt platform-coordinator, label production); scripts/setup/sync_agent_prompts.py
    # pushes the production version into ConfigMap agent-prompts. Initial seed: infra/k8s/agents/prompts/coordinator.txt.
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: coordinator}
    tools:
      - type: Agent
        agent: {name: data-agent}
        headersFrom:
          - name: Authorization
            valueFrom: {type: Secret, name: kagent-agw-key, key: AUTH_HEADER}
      - type: Agent
        agent: {name: model-agent}
        headersFrom:
          - name: Authorization
            valueFrom: {type: Secret, name: kagent-agw-key, key: AUTH_HEADER}
    deployment:
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
      # Prefer spreading replicas across workers: one dead node still leaves a running copy. 'preferred' so a 1-node kind still runs.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {kagent: coordinator}}
