# Helm values for a minimal kagent 0.10.3 on a 14 GB machine: disable all sample agents/tools, keep only controller, UI,
# bundled Postgres and kmcp. The default model routes through agentgateway (never calls the LLM directly).
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen2.5-1.5b-instruct
    apiKeySecretRef: kagent-agw-key          # created by scripts/setup/deploy_kind_agents.sh
    apiKeySecretKey: AGW_AGENT_KEY
    config:
      baseUrl: http://agentgateway.agentgateway.svc.cluster.local:3000/v1
      temperature: "0.1"
controller:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 384Mi}
ui:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
database:
  postgres:
    bundled:
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 384Mi}
# Agent→Agent calls (Agent-as-tool) and calls to MCP with an internal URL go through agentgateway (A2A/MCP gateway).
proxy:
  url: http://agentgateway.agentgateway.svc.cluster.local:3000
kagent-tools: {enabled: false}
grafana-mcp: {enabled: false}
k8s-agent: {enabled: false}
kgateway-agent: {enabled: false}
istio-agent: {enabled: false}
promql-agent: {enabled: false}
observability-agent: {enabled: false}
argo-rollouts-agent: {enabled: false}
helm-agent: {enabled: false}
cilium-policy-agent: {enabled: false}
cilium-manager-agent: {enabled: false}
cilium-debug-agent: {enabled: false}
# Controller and Agent traces (every LLM turn, tool call) are sent to Jaeger.
otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: jaeger.observability.svc.cluster.local:4317
        insecure: true
