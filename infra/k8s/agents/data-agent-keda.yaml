# Autoscale the Data Agent with KEDA on real A2A load: request rate into agentgateway route a2a-data-agent
# (Prometheus). Minimum 2 replicas (multi-replica), maximum 3; each replica handles ~0.5 requests/s.
# The Agent does not declare `replicas`, so kagent does not fight the KEDA-created HPA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-agent
  namespace: kagent
spec:
  scaleTargetRef:
    name: data-agent
  minReplicaCount: 2
  maxReplicaCount: 3   # local 14 GB; raise on GKE
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        query: sum(rate(agentgateway_requests_total{route="default/a2a-data-agent"}[1m]))
        threshold: "0.5"
