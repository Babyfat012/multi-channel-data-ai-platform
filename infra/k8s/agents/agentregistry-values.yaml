# agentregistry 0.4.0 (governance for Agents/MCP servers). Local: reuses the pgvector Postgres (ns rag) with a dedicated
# `agentregistry` database instead of the chart's bundled Postgres (saves ~450 MB disk, 256 MB RAM). The URL is in Secret
# agentregistry-db (created by scripts/setup/deploy_kind_agentregistry.sh, not in Git).
database:
  postgres:
    type: external
    external:
      secretRef:
        name: agentregistry-db
        key: AGENT_REGISTRY_DATABASE_URL
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 384Mi}
