# Small CPU LLM with an OpenAI-style API (/v1/chat/completions) for Agents. Local stand-in for llm-d
# (llm-d needs a GPU ⇒ kept for GCP). Model downloaded once into a PVC; scale to 0 when idle to free RAM.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 3Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: llm
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO PVC: the old pod must release the volume first
  selector:
    matchLabels: {app: qwen}
  template:
    metadata:
      labels: {app: qwen}
      annotations:              # Prometheus scrapes /metrics: tokens/s, requests in flight
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:9fbaa06d7f4449e2ae0d02b40e0431f7c212dcf231c9e3a7777a6afc2cc8f312  # build b11749
          # Configuration B after benchmarking (docs/ml-llm-platform/reference/llm_platform_agents.md): 3 threads (4 vCPU EKS node, measured 30/10), 4 slots, flash-attention,
          # KV cache q8_0 (saves RAM ⇒ room for ctx 16384 = 4 slots × 4096 tokens).
          args:
            - "-hf"
            - "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
            - "--alias"
            - "qwen2.5-1.5b-instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "16384"
            - "--threads"
            - "3"
            - "--parallel"
            - "4"
            - "--flash-attn"
            - "on"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--jinja"   # chat template with tool calling
            - "--metrics" # Prometheus /metrics (tokens, latency)
          env:
            - {name: LLAMA_CACHE, value: /models}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: models, mountPath: /models}]
          resources:
            requests: {cpu: "1", memory: 1200Mi}
            limits: {memory: 1600Mi}
          startupProbe:          # first start must download ~1 GB
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen
  namespace: llm
spec:
  selector: {app: qwen}
  ports: [{name: http, port: 8080, targetPort: http}]
