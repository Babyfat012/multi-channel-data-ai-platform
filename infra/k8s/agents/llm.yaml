# Model A of the Agents' LLM: vLLM CPU (Qwen2.5-1.5B-Instruct) × 2 replicas behind the llm-d EPP, which picks the
# replica per request (prefix-aware: a replica that already holds the prompt's prefix in its KV cache skips that prefill;
# then queue length and KV use). Disaggregated prefill/decode is the next llm-d step and needs GPUs: not here.
#
#   agentgateway (model qwen2.5-1.5b-instruct → its loopback :3001 route) ─ext_proc→ epp ─→ chosen qwen pod :8000
#
# Measured locally (docs/evidence/llmd-poc-20261125/, 0.5B, 2 replicas, shared-prefix load): prefix-cache hit 28% → 56%
# and TTFT p50 4.36 s → 0.36 s vs. spreading by Service. Branch B (A/B candidate): ab-llm-small.yaml.
# Sizing: one vLLM CPU replica runs 3 processes that each load torch: 0.5B + 1 GiB KV measured 5.0 GiB; 1.5B adds
# ~2 GiB of weights and the 2 GiB KV below ⇒ limit 9 GiB. The EKS nodes (2 × r6i.xlarge, 32 GiB) hold A ×2 + B.
# Local kind: too big for a laptop; scale qwen to 0 and use llm-d-poc.yaml (0.5B) instead.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: llm
spec:
  replicas: 2
  strategy: {type: Recreate}   # old + new replicas side by side would need twice the RAM
  selector:
    matchLabels: {app: qwen}
  template:
    metadata:
      labels: {app: qwen}      # the EPP's --endpoint-selector
      annotations:             # Prometheus scrapes vllm:* (tokens, queue, KV use, prefix-cache hits)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      affinity:                # one replica per node when there are two nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: qwen}}
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:v0.33.0
          args:
            - Qwen/Qwen2.5-1.5B-Instruct
            - --served-model-name=qwen2.5-1.5b-instruct
            - --port=8000
            - --max-model-len=8192
            - --dtype=bfloat16
            - --enable-prefix-caching
            - --kv-cache-memory-bytes=2147483648   # 2 GiB ≈ 75k tokens (28 KiB/token)
            # Tool calling for the Agents (llama.cpp needed --jinja for the same).
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            # No torch.compile: its warm-up builds C++ kernels on top of the loaded model (OOM-killed in the POC) and
            # adds minutes to every start.
            - -O0
            - --enforce-eager
          env:
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: "nobind"}
            - {name: OMP_NUM_THREADS, value: "3"}   # 4 vCPU nodes, same as llama.cpp's 3 threads
            - {name: HF_HOME, value: /cache}
          ports: [{name: http, containerPort: 8000}]
          volumeMounts: [{name: cache, mountPath: /cache}, {name: shm, mountPath: /dev/shm}]
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {memory: 9Gi}
          startupProbe:          # first start downloads ~3 GB
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
      volumes:
        # Per-pod download cache: a ReadWriteOnce PVC cannot follow two replicas onto two nodes.
        # ponytail: re-downloads the model on each pod start; a ReadWriteMany cache (EFS) when restarts get frequent.
        - name: cache
          emptyDir: {sizeLimit: 6Gi}
        # Container default /dev/shm is 64 MiB; the vLLM engine's shared-memory queue needs 160 MiB.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
# Plain Service: direct calls and benchmarks only (kube-proxy spreads them). Agents go through agentgateway → EPP.
apiVersion: v1
kind: Service
metadata:
  name: qwen
  namespace: llm
spec:
  selector: {app: qwen}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epp
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epp
  namespace: llm
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epp
  namespace: llm
subjects: [{kind: ServiceAccount, name: epp, namespace: llm}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: epp}
---
# llm-d-router v1.0.0 default profile: prefix cache (router-side index of what each replica served) weighs most.
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config
  namespace: llm
data:
  epp.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters: {scheme: http, path: /metrics, insecureSkipVerify: true}
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - {pluginRef: queue-scorer, weight: 2}
      - {pluginRef: kv-cache-utilization-scorer, weight: 2}
      - {pluginRef: prefix-cache-scorer, weight: 3}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp
  namespace: llm
spec:
  replicas: 1   # ponytail: single EPP and agentgateway is fail-closed ⇒ EPP down = model A down; 2 replicas + HA mode later
  selector:
    matchLabels: {app: epp}
  template:
    metadata:
      labels: {app: epp}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: epp
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          args:
            # Pods found by label (no InferencePool CRD: agentgateway runs standalone, nothing else reads a pool).
            - --endpoint-selector=app=qwen
            - --endpoint-target-ports=8000
            - --config-file=/config/epp.yaml
            - --grpc-health-port=9003
            - --secure-serving=false   # in-cluster plaintext gRPC from agentgateway
            - --metrics-endpoint-auth=false
            - --tracing=false
            - --zap-encoder=json
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME   # required at startup
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: ext-proc, containerPort: 9002}
            - {name: health, containerPort: 9003}
            - {name: metrics, containerPort: 9090}
          readinessProbe:          # same gRPC health service names as the llm-d-router chart
            grpc: {port: 9003, service: readiness}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 9003, service: liveness}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{name: config, mountPath: /config}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: epp-config}
---
apiVersion: v1
kind: Service
metadata:
  name: epp
  namespace: llm
spec:
  selector: {app: epp}
  ports:
    - {name: ext-proc, port: 9002, targetPort: ext-proc, appProtocol: http2}
    - {name: metrics, port: 9090, targetPort: metrics}
