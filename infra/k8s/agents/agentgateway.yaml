# agentgateway: the single gateway for Agents calling the LLM (/v1/...) and MCP tools (/mcp). Policy lives in one place:
# API key (Secret agentgateway-keys, created by scripts/setup/deploy_kind_agents.sh), rate limit, only approved tools callable.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: agentgateway
data:
  config.yaml: |
    config:
      adminAddr: 0.0.0.0:15000
      statsAddr: 0.0.0.0:15020       # /metrics Prometheus: request, token LLM, tool call
      readinessAddr: 0.0.0.0:15021
      tracing:                       # trace every LLM/MCP/A2A request to Jaeger (OTLP gRPC)
        otlpEndpoint: http://jaeger.observability.svc.cluster.local:4317
        randomSampling: true
    gateways:
      default:
        port: 3000
    llm:
      policies:
        apiKey:                      # missing/wrong key ⇒ 401
          mode: strict
          keys:
          - key: $AGW_AGENT_KEY
            metadata: {name: kagent-agents}
        localRateLimit:              # token bucket: at most 60 queued requests, refills 1 request/s
        - maxTokens: 60
          tokensPerFill: 1
          fillInterval: 1s
          type: requests
      models:
      - name: qwen2.5-1.5b-instruct
        provider:
          custom:
            formats:
            - type: completions
        params:
          model: qwen2.5-1.5b-instruct
          baseUrl: http://qwen.llm.svc.cluster.local:8080/v1
        # PII: block requests containing email / credit card / SSN (403), mask PII in responses.
        # Phone numbers are not blocked in requests: quantities, prices, SKU codes are easily misdetected. Counted in
        # agentgateway_guardrail_checks_total.
        guardrails: &pii
          request:
          - regex:
              action: reject
              rules:
              - builtin: email
              - builtin: creditCard
              - builtin: ssn
            rejection:
              status: 403
              headers:
                set: {content-type: application/json}
              body: '{"error":{"message":"Request blocked: contains personal data (PII)","code":"pii_detected"}}'
          response:
          - regex:
              action: mask
              rules:
              - builtin: email
              - builtin: phoneNumber
              - builtin: creditCard
      # A/B: branch B = a smaller model from the same Qwen family.
      - name: qwen2.5-0.5b-instruct
        provider:
          custom:
            formats:
            - type: completions
        params:
          model: qwen2.5-0.5b-instruct
          baseUrl: http://qwen-small.llm.svc.cluster.local:8080/v1
        guardrails: *pii
      # Agents/clients call the virtual model `platform-chat`; the gateway splits 50/50 between A and B. Metrics/traces record the
      # real model (gen_ai_response_model) ⇒ latency, tokens, errors can be compared per branch in Grafana.
      virtualModels:
      - name: platform-chat
        routing:
          weighted:
            targets:
            - model: qwen2.5-1.5b-instruct
              weight: 1
            - model: qwen2.5-0.5b-instruct
              weight: 1
    # A2A: Agents never call each other directly. kagent sets `proxy.url` = gateway ⇒ Agent→Agent calls arrive here with header
    # x-kagent-host = "<agent>.<ns>" (kagent applyProxyURL); the route picks the Agent by that header. Clients outside the cluster
    # use the /a2a/<agent>/ path. The a2a policy rewrites `url` in the agent card to the gateway. New Agent = add a route.
    routes:
    - name: a2a-data-agent
      matches:
      - path: {pathPrefix: /}
        headers:
        - name: x-kagent-host
          value: {exact: data-agent.kagent}
      policies:
        apiKey: &a2a-key
          mode: strict
          keys:
          - key: $AGW_AGENT_KEY
            metadata: {name: kagent-agents}
        a2a: {}
      backends:
      - host: data-agent.kagent.svc.cluster.local:8080
    - name: a2a-data-agent-path
      matches:
      - path: {pathPrefix: /a2a/data-agent/}
      policies:
        apiKey: *a2a-key
        a2a: {}
        urlRewrite:
          path: {prefix: /}
      backends:
      - host: data-agent.kagent.svc.cluster.local:8080
    # Direct path to branch B (the eval harness scores each branch separately).
    - name: a2a-data-agent-b-path
      matches:
      - path: {pathPrefix: /a2a/data-agent-b/}
      policies:
        apiKey: *a2a-key
        a2a: {}
        urlRewrite:
          path: {prefix: /}
      backends:
      - host: data-agent-b.kagent.svc.cluster.local:8080
    # A/B agent: one entry point, two Data Agent copies with different ModelConfigs, split by weight.
    - name: a2a-data-agent-ab
      matches:
      - path: {pathPrefix: /a2a/data-agent-ab/}
      policies:
        apiKey: *a2a-key
        a2a: {}
        urlRewrite:
          path: {prefix: /}
      backends:
      - host: data-agent.kagent.svc.cluster.local:8080
        weight: 1
      - host: data-agent-b.kagent.svc.cluster.local:8080
        weight: 1
    - name: a2a-model-agent
      matches:
      - path: {pathPrefix: /}
        headers:
        - name: x-kagent-host
          value: {exact: model-agent.kagent}
      policies:
        apiKey: *a2a-key
        a2a: {}
      backends:
      - host: model-agent.kagent.svc.cluster.local:8080
    - name: a2a-model-agent-path
      matches:
      - path: {pathPrefix: /a2a/model-agent/}
      policies:
        apiKey: *a2a-key
        a2a: {}
        urlRewrite:
          path: {prefix: /}
      backends:
      - host: model-agent.kagent.svc.cluster.local:8080
    - name: a2a-coordinator
      matches:
      - path: {pathPrefix: /}
        headers:
        - name: x-kagent-host
          value: {exact: coordinator.kagent}
      policies:
        apiKey: *a2a-key
        a2a: {}
      backends:
      - host: coordinator.kagent.svc.cluster.local:8080
    - name: a2a-coordinator-path
      matches:
      - path: {pathPrefix: /a2a/coordinator/}
      policies:
        apiKey: *a2a-key
        a2a: {}
        urlRewrite:
          path: {prefix: /}
      backends:
      - host: coordinator.kagent.svc.cluster.local:8080
    # MCP gateway: a single /mcp route (not the short `mcp:` block: that block matches EVERY path and takes precedence over
    # the header-based A2A routes). No rate limit set: version 1.6.0 does not apply it to MCP (measured 2026-10-21:
    # 300 requests/0.4 s all 200); rate limiting is effective on the LLM branch.
    - name: mcp
      matches:
      - path: {pathPrefix: /mcp}
      policies:
        apiKey: *a2a-key
        mcpAuthorization:            # tools not on the list are hidden from tools/list and blocked when called
          rules:
          - 'mcp.tool.name == "get_sku_features"'
          - 'mcp.tool.name == "get_policy_chunks"'
          - 'mcp.tool.name == "search_policy_chunks"'
          - 'mcp.tool.name == "predict_return_risk"'
      backends:
      - mcp:
          targets:
          - name: features
            mcp:
              host: http://feature-mcp.feature-store.svc.cluster.local:8000/mcp/   # dedicated MCP server pod (release feature-mcp)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: agentgateway}
  template:
    metadata:
      labels: {app: agentgateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
    spec:
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
          args: ["-f", "/config/config.yaml"]
          envFrom: [{secretRef: {name: agentgateway-keys}}]
          ports:
            - {name: http, containerPort: 3000}
            - {name: metrics, containerPort: 15020}
          volumeMounts: [{name: config, mountPath: /config}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz/ready, port: 15021}
            periodSeconds: 5
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  selector: {app: agentgateway}
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: metrics, port: 15020, targetPort: metrics}
