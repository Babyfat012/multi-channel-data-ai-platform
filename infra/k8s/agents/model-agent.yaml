# Agent 2 (Model + RAG Agent): data from the Online Feature Store + 2 main tools: prediction via KServe
# (`predict_return_risk`) and RAG (`search_policy_chunks`, Feast pgvector). All tools go through agentgateway /mcp.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: model-agent
  namespace: kagent
spec:
  type: Declarative
  # This description is the tool description the Coordinator (LLM) sees ⇒ English, with keywords so a small model picks correctly.
  description: Answers ALL return/refund policy questions (Amazon, Walmart, Shopify, TikTok Shop, Shopee, seller playbook) from documents, and scores the return risk of a new order.
  declarative:
    modelConfig: default-model-config
    stream: false
    # System prompt managed in Langfuse (prompt platform-model-agent, label production); scripts/setup/sync_agent_prompts.py
    # pushes the production version into ConfigMap agent-prompts. Initial seed: infra/k8s/agents/prompts/model-agent.txt.
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: model-agent}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features, predict_return_risk, search_policy_chunks]
    deployment:
      # No `replicas`: the replica count is decided by KEDA (model-agent-keda.yaml).
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
      # Prefer spreading replicas across workers: one dead node still leaves a running copy. 'preferred' so a 1-node kind still runs.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {kagent: model-agent}}
