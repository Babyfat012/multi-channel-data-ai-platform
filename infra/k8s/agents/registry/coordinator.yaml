# agentregistry catalog: Coordinator — runs on kagent (infra/k8s/agents/coordinator.yaml), model via agentgateway.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: coordinator
spec:
  title: Coordinator
  description: "Routes Seller questions to the Data Agent or the Model Agent over A2A (agentgateway). Model: ModelConfig default-model-config (via agentgateway)."
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    protocol: A2A
    repository:
      url: https://github.com/Babyfat012/multi-channel-data-ai-platform
      subfolder: infra/k8s/agents
