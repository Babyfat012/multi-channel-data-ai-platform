# agentregistry catalog: Data Agent — runs on kagent (infra/k8s/agents/data-agent.yaml), model via agentgateway.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: data-agent
spec:
  title: Data Agent
  description: "Pulls data from the Online Feature Store by ID: SKU return features and policy chunks by chunk_id. Model: ModelConfig default-model-config (via agentgateway)."
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    protocol: A2A
    repository:
      url: https://github.com/Babyfat012/multi-channel-data-ai-platform
      subfolder: infra/k8s/agents
  mcpServers:
    - kind: MCPServer
      name: feature-tools
