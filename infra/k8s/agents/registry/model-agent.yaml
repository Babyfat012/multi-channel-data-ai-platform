# agentregistry catalog: Model Agent — runs on kagent (infra/k8s/agents/model-agent.yaml), model via agentgateway.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: model-agent
spec:
  title: Model Agent
  description: "Scores Return risk for new orders (KServe return-risk) and answers return policy questions with RAG (Feast pgvector). Model: ModelConfig default-model-config (via agentgateway)."
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    protocol: A2A
    repository:
      url: https://github.com/Babyfat012/multi-channel-data-ai-platform
      subfolder: infra/k8s/agents
  mcpServers:
    - kind: MCPServer
      name: feature-tools
