# agentregistry catalog: MCP server (mcp-server release, ns serving-api, 4 tools) — declared as remote because it already runs behind agentgateway /mcp.
# Publish: arctl apply -f infra/k8s/agents/registry/ (scripts/llm/publish_agentregistry.py).
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: feature-tools
spec:
  title: PLATFORM Feature Tools
  description: >-
    Return features per SKU (Feast/Redis), policy chunks by id and by question search (Feast/pgvector),
    Return risk score (KServe return-risk). Tools: get_sku_features, get_policy_chunks, search_policy_chunks,
    predict_return_risk. Requires an agentgateway API key. Code: serving/mcp_server.py (Helm infra/helm/serving-api, release mcp-server); it calls feature-api, policy-api and KServe.
  remote:
    type: streamable-http
    url: http://agentgateway.agentgateway.svc.cluster.local:3000/mcp
