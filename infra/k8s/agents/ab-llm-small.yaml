# A/B: branch B = a smaller LLM (Qwen2.5-0.5B-Instruct) on the same vLLM CPU image and settings as branch A
# (llm.yaml, 1.5B), so only the model differs. agentgateway splits traffic by weight between the two (virtual model
# `platform-chat`). One replica, called directly (no EPP: nothing to pick between). scripts/llm/ab_gate.py scales it
# up for the eval and back to 0 if B loses. Measured 5.0 GiB with 1 GiB KV (docs/evidence/llmd-poc-20261125/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-small
  namespace: llm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qwen-small}
  template:
    metadata:
      labels: {app: qwen-small}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:v0.33.0
          args:
            - Qwen/Qwen2.5-0.5B-Instruct
            - --served-model-name=qwen2.5-0.5b-instruct
            - --port=8000
            - --max-model-len=8192
            - --dtype=bfloat16
            - --enable-prefix-caching
            - --kv-cache-memory-bytes=1073741824   # 1 GiB ≈ 87k tokens (12 KiB/token)
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - -O0
            - --enforce-eager
          env:
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: "nobind"}
            - {name: OMP_NUM_THREADS, value: "3"}
            - {name: HF_HOME, value: /cache}
          ports: [{name: http, containerPort: 8000}]
          volumeMounts: [{name: cache, mountPath: /cache}, {name: shm, mountPath: /dev/shm}]
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {memory: 6Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 3Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-small
  namespace: llm
spec:
  selector: {app: qwen-small}
  ports: [{name: http, port: 8080, targetPort: http}]
