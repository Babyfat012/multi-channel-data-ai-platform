# Minimal Prometheus for local kind (chart prometheus-community/prometheus 29.36.2): server only, 6-hour retention.
# Scrapes pods annotated prometheus.io/scrape (agentgateway, llama.cpp, Feature API) for KEDA and Grafana.
alertmanager: {enabled: false}
prometheus-pushgateway: {enabled: false}
prometheus-node-exporter: {enabled: false}
kube-state-metrics: {enabled: false}
# Sidecar reloads config when the ConfigMap changes. Without it, `helm upgrade` changes targets but Prometheus keeps the old config
# (30/10: kept scraping old EC2 IP 10.42.0.12 for 13 hours after values pointed to 10.42.0.151).
configmapReload:
  prometheus:
    enabled: true
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 32Mi}
server:
  retention: 6h
  persistentVolume: {enabled: false}
  global:
    scrape_interval: 15s
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
