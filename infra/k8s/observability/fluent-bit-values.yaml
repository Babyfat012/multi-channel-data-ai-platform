# Fluent Bit (chart fluent/fluent-bit 0.58.3): reads container logs on the kind node, adds k8s labels, pushes to Loki.
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 96Mi}
config:
  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.observability.svc.cluster.local
        Port        3100
        Labels      job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], app=$kubernetes['labels']['app']
        Remove_keys kubernetes,stream
        Line_format json
