# EKS only (deploy_kind_observability.sh loads it when KCTX is not kind-*): Prometheus pulls exporters on
# EC2 over private IP (SG opens 9100/9187 from the cluster SG). No Alertmanager: rules show on the Alerts page of
# Prometheus/Grafana. Limitation: nobody is notified unless the page is open; prod adds Alertmanager + mail.
extraScrapeConfigs: |
  - job_name: ec2-node
    static_configs: [{targets: ["10.42.0.151:9100"]}]
  - job_name: ec2-postgres
    static_configs: [{targets: ["10.42.0.151:9187"]}]
serverFiles:
  alerting_rules.yml:
    groups:
      - name: ec2-data-platform
        rules:
          # Pull: a dead EC2/exporter makes the scrape fail and yields up=0 by itself — no "silence" rule needed.
          - alert: EC2ExporterDown
            expr: up{job=~"ec2-.*"} == 0
            for: 2m
          # Gap #20: on 28/10 a Spark shuffle filled the EBS ⇒ Postgres died, nobody noticed.
          - alert: EC2DataDiskAlmostFull
            expr: 1 - node_filesystem_avail_bytes{mountpoint="/mnt/platform-data"} / node_filesystem_size_bytes{mountpoint="/mnt/platform-data"} > 0.8
            for: 5m
          # Gap #17: a replication slot (Debezium) not being read ⇒ Postgres keeps WAL forever ⇒ disk full.
          - alert: PostgresSlotWalRetained
            expr: pg_replication_slot_slot_current_wal_lsn - pg_replication_slot_slot_confirmed_flush_lsn > 1073741824
            for: 10m
