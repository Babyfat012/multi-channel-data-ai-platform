# Grafana (chart grafana/grafana 10.5.15): one place to view metrics (Prometheus), logs (Loki) and traces (Jaeger).
# Admin password in Secret grafana-admin (created by scripts/setup/deploy_kind_observability.sh, not in Git).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
persistence: {enabled: false}
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 256Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, isDefault: true,
         url: http://prometheus-server.observability.svc.cluster.local}
      - {name: Loki, uid: loki, type: loki, access: proxy, url: http://loki.observability.svc.cluster.local:3100}
      - {name: Jaeger, uid: jaeger, type: jaeger, access: proxy, url: http://jaeger.observability.svc.cluster.local:16686}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - {name: platform, folder: PLATFORM, type: file, disableDeletion: true, options: {path: /var/lib/grafana/dashboards/platform}}
dashboardsConfigMaps:
  platform: grafana-dashboards-platform
# The Ingress already has basic auth (user ops) ⇒ an Authorization: Basic header reaches Grafana. Disable Grafana's basic auth
# so it does not mistake that for a Grafana account (401); log in to Grafana via the form as usual.
grafana.ini:
  auth.basic:
    enabled: false
