# The operator runs this playbook against the EC2; by default it does not run the Cloud smoke test.
- name: Prepare the Data Platform runtime on a single VM
  hosts: aws
  become: true
  roles:
    - role: base
    - role: data_disk
    - role: app
    - role: datahub
      when: enable_datahub | default(true) | bool
    - role: smoke
      tags: [never, smoke]
