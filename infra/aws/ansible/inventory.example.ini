# Fill in Terraform outputs: ansible_host is the instance ID; SSH goes through SSM, so no IP or port 22 is needed. accept-new: trusts the host key on first connect (Ansible cannot answer yes/no); a key that changes later is still rejected.
[aws]
platform ansible_host=INSTANCE_ID ansible_user=ubuntu

[aws:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/platform_aws
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region REGION"
