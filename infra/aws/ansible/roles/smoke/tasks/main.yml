# Checks the real runtime when the operator runs --tags smoke; no fabricated metrics.
- name: Check health and status of all Data Platform v2 containers
  ansible.builtin.command: docker compose --profile catalog --profile spark --profile airflow ps --all --format json
  args:
    chdir: '{{ app_dir }}'
  register: runtime_ps
  changed_when: false
- name: Verify running containers, completed inits and absent MinIO
  ansible.builtin.command:
    argv: [python3, infra/aws/ansible/roles/smoke/files/check_containers.py]
    stdin: '{{ runtime_ps.stdout }}'
    chdir: '{{ app_dir }}'
  changed_when: false
- name: Check the Lakekeeper warehouse via the idempotent script
  ansible.builtin.command: bash scripts/setup/setup_lakekeeper_s3.sh
  args:
    chdir: '{{ app_dir }}'
  changed_when: false
- name: Run Iceberg S3 write/read through the Airflow driver
  ansible.builtin.shell: |
    set -a
    source .env
    set +a
    docker compose --profile airflow exec -T airflow spark-submit \
      --master spark://spark-master:7077 --driver-memory 1g \
      --conf spark.driver.host=airflow --conf spark.driver.bindAddress=0.0.0.0 \
      --conf spark.cores.max=2 --conf spark.executor.memory=1g \
      --conf spark.jars.ivy=/opt/airflow/.ivy2 --packages "$PLATFORM_SPARK_PACKAGES_AWS" \
      /opt/aws-runtime/roles/smoke/files/s3_smoke.py
  args:
    executable: /bin/bash
    chdir: '{{ app_dir }}'
  # The temporary table is dropped within the same check; business state is untouched.
  changed_when: false
- name: Check that Airflow picks up the v2 DAGs
  ansible.builtin.command: docker compose --profile airflow exec -T airflow airflow dags list --output json
  args:
    chdir: '{{ app_dir }}'
  register: dag_list
  changed_when: false
- name: Verify DAG names
  ansible.builtin.assert:
    that: "'dp_order_lifecycle' in (dag_list.stdout | from_json | map(attribute='dag_id') | list)"
