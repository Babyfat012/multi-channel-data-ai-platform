# Runs only with --tags source_data; aws s3 sync has no --delete, so no objects are removed.
- name: Check the source generation choice
  ansible.builtin.assert:
    that:
      - source_mode in ['fixture', 'scale']
      - source_dataset_name is match('^[a-zA-Z0-9_-]+$')
- name: Generate a small fixture if no manifest exists
  ansible.builtin.command:
    argv:
      - /mnt/platform-data/venv/bin/python
      - -m
      - generator.generate_order_lifecycle_fixture
      - --output
      - '/mnt/platform-data/source/{{ source_dataset_name }}'
    chdir: '{{ app_dir }}'
    creates: '/mnt/platform-data/source/{{ source_dataset_name }}/manifest.json'
  when: source_mode == 'fixture'
- name: Generate the scaled source by seed and horizon if no manifest exists
  ansible.builtin.command:
    argv:
      - /mnt/platform-data/venv/bin/python
      - -m
      - generator.generate_order_lifecycle
      - --output
      - '/mnt/platform-data/source/{{ source_dataset_name }}'
      - --seed
      - '{{ source_seed | string }}'
      - --days
      - '{{ source_days | string }}'
      - --orders-per-day
      - '{{ source_orders_per_day | string }}'
      - --followup-days
      - '{{ source_followup_days | string }}'
      - --observation-days
      - '{{ source_observation_days | string }}'
    chdir: '{{ app_dir }}'
    creates: '/mnt/platform-data/source/{{ source_dataset_name }}/manifest.json'
  when: source_mode == 'scale'
- name: Sync sources to a dedicated S3 prefix using the EC2 IAM role
  ansible.builtin.command:
    argv:
      - /snap/bin/aws
      - s3
      - sync
      - --exclude=_truth/*
      - --region={{ aws_region }}
      - '/mnt/platform-data/source/{{ source_dataset_name }}'
      - 's3://{{ raw_bucket }}/order_lifecycle/{{ source_dataset_name }}'
  register: source_upload
  changed_when: "'upload:' in source_upload.stdout"
- name: Load Walmart (fixture via the existing script, scale via the multi-file helper)
  ansible.builtin.command:
    argv: '{{ source_loader_argv }}'
    chdir: '{{ app_dir }}'
  environment:
    PYTHONPATH: '{{ app_dir }}'
  vars:
    source_loader_argv: >-
      {{ ['/mnt/platform-data/venv/bin/python',
      ('scripts/setup/load_order_lifecycle_walmart.py' if source_mode == 'fixture' else
       'infra/aws/ansible/roles/source_data/files/load_scaled_walmart.py'),
      '--root', '/mnt/platform-data/source/' + source_dataset_name] }}
  # The script replaces data in one transaction; reruns do not increase the row count.
  changed_when: false
  no_log: true
