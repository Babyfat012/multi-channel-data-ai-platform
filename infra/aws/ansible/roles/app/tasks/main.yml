# Sync code and deploy Compose; never copy credentials or local data to the VM.
- name: Check required variables and filled-in secrets
  ansible.builtin.assert:
    that:
      - aws_region is match('^[a-z]{2}-[a-z]+-[0-9]$')
      - raw_bucket != 'CHANGE_ME'
      - lakehouse_bucket != 'CHANGE_ME'
      - postgres_password != 'CHANGE_ME'
      - lakekeeper_encryption_key != 'CHANGE_ME'
      - postgres_password is match('^[A-Za-z0-9_-]{16,}$')
      - lakekeeper_encryption_key is match('^[A-Za-z0-9_-]{32,}$')
      - source_dataset_name is match('^[a-zA-Z0-9_-]+$')
      - warehouse_name is match('^[a-zA-Z0-9_-]+$')
      - (aws_runtime_profile | default('standard')) in ['standard', 'performance']
  no_log: true
- name: Check resources before enabling the performance profile
  ansible.builtin.assert:
    that:
      - ansible_facts['processor_vcpus'] | int >= 8
      - ansible_facts['memtotal_mb'] | int >= 30000
    fail_msg: The performance profile requires a VM with at least 8 vCPU/32 GiB.
  when: (aws_runtime_profile | default('standard')) == 'performance'
- name: Check that Compose supports override
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
- name: Require Compose 2.24.4 or newer
  ansible.builtin.assert:
    that: (compose_version.stdout | trim | regex_replace('^v', '')) is version('2.24.4', '>=')
- name: Create the app directory
  ansible.builtin.file:
    path: '{{ app_dir }}'
    owner: '{{ ansible_user }}'
    state: directory
    mode: '0755'
- name: Sync the repo with rsync, excluding secrets and generated directories
  ansible.posix.synchronize:
    src: '{{ repo_local }}/'
    dest: '{{ app_dir }}/'
    use_ssh_args: true
    rsync_path: sudo rsync
    rsync_opts:
      - '--exclude=.venv/'
      - '--exclude=out/'
      - '--exclude=.git/'
      - '--exclude=.env'
      - '--exclude=.env.*'
      - '--exclude=.briefs/'
      - '--exclude=.vibe-wise/'
      - '--exclude=.aws/'
      - '--exclude=.codex/'
      - '--exclude=.claude/'
      - '--exclude=__pycache__/'
      - '--exclude=infra/aws/ansible/group_vars/'
      - '--exclude=infra/aws/terraform/'
      - '--exclude=infra/aws/kubernetes/'
      - '--exclude=.archive/'
  register: app_sync
  # --tags code: sync code only (dags/, spark_jobs/, scripts/, trino/ are bind mounts, so no
  # restart is needed). Changes to compose/.env/Dockerfile still need the full playbook.
  tags: [code]
- name: Create persistent directories for Spark
  ansible.builtin.file:
    path: '/mnt/platform-data/{{ item }}'
    state: directory
    mode: '0775'
    owner: '{{ airflow_uid }}'
    group: '0'
  loop: [airflow, spark-events, spark-worker-1, spark-worker-2, source]
- name: Create a dedicated PostgreSQL directory
  ansible.builtin.file:
    path: /mnt/platform-data/postgres
    state: directory
    mode: '0700'
- name: Render env from the filled-in variables
  ansible.builtin.template:
    src: env.j2
    dest: '{{ app_dir }}/.env'
    owner: '{{ ansible_user }}'
    mode: '0600'
  no_log: true
- name: Check whether the image has been built
  ansible.builtin.command: docker image inspect platform-airflow:2.10.5-spark3.5.3
  register: airflow_image
  changed_when: false
  failed_when: false
# Code is mounted into the container and the image holds only Java + libraries: rebuild when the Dockerfile changes, not when code changes.
- name: Read the airflow Dockerfile checksum
  ansible.builtin.stat:
    path: '{{ app_dir }}/docker/Dockerfile.airflow'
  register: airflow_dockerfile
- name: Compare the checksum with the previous build
  ansible.builtin.copy:
    content: '{{ airflow_dockerfile.stat.checksum }}'
    dest: /mnt/platform-data/airflow/.dockerfile.sha1
    mode: '0644'
  check_mode: true
  register: airflow_dockerfile_stamp
- name: Build the driver and executor image on the same Python 3.10
  ansible.builtin.command: docker compose --profile airflow build airflow
  args:
    chdir: '{{ app_dir }}'
  when: airflow_dockerfile_stamp.changed or airflow_image.rc != 0
  changed_when: true
# Write the marker AFTER a successful build: a failed build is retried on the next run.
- name: Record the built Dockerfile checksum
  ansible.builtin.copy:
    content: '{{ airflow_dockerfile.stat.checksum }}'
    dest: /mnt/platform-data/airflow/.dockerfile.sha1
    mode: '0644'
- name: Create the Fernet key once before Airflow starts
  ansible.builtin.command:
    argv:
      - python3
      - infra/aws/ansible/roles/app/files/ensure_fernet.py
      - /mnt/platform-data/airflow/.fernet_key
      - '{{ airflow_uid | string }}'
    chdir: '{{ app_dir }}'
  register: fernet_setup
  changed_when: "'created' in fernet_setup.stdout"
  no_log: true
- name: Start exactly the Data Platform v2 services and wait for healthchecks
  ansible.builtin.command: >-
    docker compose --profile catalog --profile spark --profile airflow up -d --wait --wait-timeout 300
    postgres lakekeeper spark-master spark-worker-1 spark-worker-2 airflow node-exporter postgres-exporter
  args:
    chdir: '{{ app_dir }}'
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
  no_log: true
- name: Build image MLflow (pip mlflow + psycopg2 + boto3)
  ansible.builtin.command: docker compose --profile ml build mlflow
  args:
    chdir: '{{ app_dir }}'
  changed_when: false
- name: Start MLflow (mlflow + db-init only, no local registry)
  ansible.builtin.command: docker compose --profile ml up -d --wait --wait-timeout 180 mlflow
  args:
    chdir: '{{ app_dir }}'
  register: mlflow_up
  changed_when: "'Started' in mlflow_up.stderr or 'Created' in mlflow_up.stderr or 'Recreated' in mlflow_up.stderr"
  no_log: true
- name: Wait for Airflow metadata and scheduler to be ready
  ansible.builtin.uri:
    url: http://127.0.0.1:8081/health
    return_content: true
  register: airflow_health
  until: >-
    airflow_health.status == 200 and
    airflow_health.json.metadatabase.status == 'healthy' and
    airflow_health.json.scheduler.status == 'healthy'
  retries: 60
  delay: 5
- name: Bootstrap Lakekeeper S3 and check the warehouse config on reruns
  ansible.builtin.command: bash scripts/setup/setup_lakekeeper_s3.sh
  args:
    chdir: '{{ app_dir }}'
  register: warehouse_setup
  changed_when: "'Created the S3 warehouse' in warehouse_setup.stdout"
- name: Load Airflow config and AWS Variables
  ansible.builtin.shell: |
    set -a
    source .env
    set +a
    bash scripts/setup/setup_airflow.sh
  args:
    executable: /bin/bash
    chdir: '{{ app_dir }}'
  # The upsert commands converge the DB to the same config without duplicate records.
  changed_when: false
  no_log: true
- name: Prepare the venv for source generation and PostgreSQL loading
  ansible.builtin.pip:
    name:
      - 'psycopg[binary]==3.2.13'
      # The Walmart loader uses load_settings from setup_debezium, which imports the Kafka client.
      - 'confluent-kafka==2.15.1'
    virtualenv: /mnt/platform-data/venv
    virtualenv_command: python3 -m venv
