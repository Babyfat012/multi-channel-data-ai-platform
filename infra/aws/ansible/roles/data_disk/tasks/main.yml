# Identify the EBS by volume ID (Nitro instances rename /dev/sdf to nvme); blkid protects an existing filesystem before mkfs.
- name: Confirm the volume ID is set
  ansible.builtin.assert:
    that:
      - data_volume_id is match('^vol-[0-9a-f]+$')
- name: Find the EBS by volume ID
  ansible.builtin.stat:
    path: '{{ data_disk_path }}'
    follow: true
  register: data_disk
- name: Require a block device
  ansible.builtin.assert:
    that: [data_disk.stat.exists, data_disk.stat.isblk]
- name: Check filesystem signatures with blkid
  ansible.builtin.command:
    argv: [blkid, -p, '-o', value, '-s', TYPE, '{{ data_disk_path }}']
  register: disk_blkid
  changed_when: false
  failed_when: disk_blkid.rc not in [0, 2]
- name: Check all signatures and partitions before allowing a format
  ansible.builtin.command:
    argv: [lsblk, --json, --output, 'NAME,FSTYPE,MOUNTPOINT,PTTYPE', '{{ data_disk_path }}']
  register: disk_layout
  changed_when: false
- name: Refuse to format a disk with partitions or mounts even if blkid sees no filesystem
  ansible.builtin.assert:
    that:
      - (disk_layout.stdout | from_json).blockdevices[0].children is not defined
      - not (disk_layout.stdout | from_json).blockdevices[0].pttype
      - not (disk_layout.stdout | from_json).blockdevices[0].mountpoint
  when: disk_blkid.rc == 2
- name: Run mkfs only when blkid confirms there is no filesystem
  ansible.builtin.command:
    argv: [mkfs.ext4, '{{ data_disk_path }}']
  when: disk_blkid.rc == 2
  changed_when: true
- name: Read the filesystem UUID
  ansible.builtin.command:
    argv: [blkid, '-o', value, '-s', UUID, '{{ data_disk_path }}']
  register: disk_uuid
  changed_when: false
- name: Read the actual filesystem type
  ansible.builtin.command:
    argv: [blkid, '-o', value, '-s', TYPE, '{{ data_disk_path }}']
  register: disk_fstype
  changed_when: false
- name: Create the mountpoint
  ansible.builtin.file:
    path: /mnt/platform-data
    state: directory
    mode: '0755'
- name: Write the UUID mount entry and mount if missing
  ansible.posix.mount:
    path: /mnt/platform-data
    src: 'UUID={{ disk_uuid.stdout | trim }}'
    fstype: '{{ disk_fstype.stdout | trim }}'
    opts: defaults
    state: mounted
- name: Grow the filesystem when the EBS volume is enlarged (ext4 grows while mounted; no-op when already full size)
  ansible.builtin.command:
    argv: [resize2fs, '{{ data_disk_path }}']
  register: disk_resize
  changed_when: "'Nothing to do' not in disk_resize.stderr"
# Docker 29 uses the containerd image store: images in /var/lib/containerd, containers/volumes in /var/lib/docker.
# Both default to the 30 GB root disk (filled up on 27 and 28/10). Bind mount both directories from the EBS, keeping the same paths.
- name: Check whether Docker/containerd storage is already on the EBS
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, SOURCE, '/var/lib/{{ item }}']
  loop: [containerd, docker]
  register: engine_mounts
  changed_when: false
  failed_when: false
- name: Move Docker/containerd storage to the EBS (once; stops all containers for a few minutes)
  when: engine_mounts.results | selectattr('rc', 'ne', 0) | list | length > 0
  block:
    - name: Stop Docker and containerd for a consistent copy
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
      loop: [docker.socket, docker, containerd]
    - name: Copy to the EBS (keeps hardlinks/xattrs/owners; no --delete, so reruns are safe)
      ansible.builtin.command:
        argv: [rsync, -aHAXx, --numeric-ids, '/var/lib/{{ item }}/', '/mnt/platform-data/{{ item }}/']
      loop: [containerd, docker]
      changed_when: true
    - name: Keep the old copy for comparison; the operator deletes it after checking
      ansible.builtin.command:
        argv: [mv, '/var/lib/{{ item }}', '/var/lib/{{ item }}.pre-ebs']
        creates: '/var/lib/{{ item }}.pre-ebs'
      loop: [containerd, docker]
    - name: Recreate the empty mountpoint
      ansible.builtin.file:
        path: '/var/lib/{{ item }}'
        state: directory
        mode: '0710'
      loop: [containerd, docker]
- name: Bind mount Docker/containerd storage from the EBS, only after the EBS is mounted
  ansible.posix.mount:
    path: '/var/lib/{{ item }}'
    src: '/mnt/platform-data/{{ item }}'
    fstype: none
    opts: bind,x-systemd.requires-mounts-for=/mnt/platform-data
    state: mounted
  loop: [containerd, docker]
- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
    mode: '0755'
  loop: [containerd, docker]
- name: Block Docker/containerd from starting before the EBS is attached (otherwise they silently create empty storage on the root disk)
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.service.d/data-disk.conf'
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/containerd /var/lib/docker
    mode: '0644'
  loop: [containerd, docker]
  register: engine_dropin
- name: Reload systemd and start Docker again
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: started
    daemon_reload: '{{ engine_dropin is changed }}'
  loop: [containerd, docker]
