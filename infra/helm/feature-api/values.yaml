# Change image.tag on every deploy so k8s does a rolling update; `helm upgrade --atomic` rolls back automatically if the new pod is not Ready.
image:
  repository: localhost:5001/platform-feature-api
  tag: "0.1.0"  # the deploy script always overrides it with the git SHA/TAG
  pullPolicy: IfNotPresent
replicas: 2
# rest = Feature API (REST); release feature-mcp sets mcp via values-mcp.yaml (dedicated MCP server pod).
surface: rest
# KEDA ScaledObject (needs KEDA + Prometheus in the cluster); enabled on EKS by values-aws.yaml.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  threshold: 10   # requests/s per pod
  prometheus: http://prometheus-server.observability.svc.cluster.local
# Secret holding AWS_*, FEAST_*; created outside the chart from .env (scripts/setup/deploy_kind_feature_api.sh).
envSecret: feature-api-env
nodePort: 30800
service:
  type: NodePort
  port: 8000
serviceAccount:
  create: false
  name: ""
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 768Mi}   # + ONNX embedding model (~200 MB when loaded)
