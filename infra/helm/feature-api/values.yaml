# Đổi image.tag mỗi lần deploy để k8s rolling update; `helm upgrade --atomic` tự rollback nếu pod mới không Ready.
image:
  repository: localhost:5001/platform-feature-api
  tag: "0.1.0"  # script deploy luôn ghi đè bằng git SHA/TAG
  pullPolicy: IfNotPresent
replicas: 2
# rest = Feature API (REST); release feature-mcp đặt mcp qua values-mcp.yaml (MCP server pod riêng).
surface: rest
# KEDA ScaledObject (cần KEDA + Prometheus trong cluster); values-aws.yaml bật trên EKS.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  threshold: 10   # request/giây mỗi pod
  prometheus: http://prometheus-server.observability.svc.cluster.local
# Secret chứa AWS_*, FEAST_*; tạo ngoài chart từ .env (scripts/setup/deploy_kind_feature_api.sh).
envSecret: feature-api-env
nodePort: 30800
service:
  type: NodePort
  port: 8000
serviceAccount:
  create: false
  name: ""
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 768Mi}   # + model embedding ONNX (~200 MB khi nạp)
