# Feature Web API Deployment: rolling update without reducing replicas, probes for k8s, preStop waits for removal from the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  {{- if not .Values.autoscaling.enabled }}   # with autoscaling enabled the HPA owns the replica count
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    # Add 1 new pod, drop an old pod only once the new one is Ready: always enough replicas serving.
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:   # Prometheus scrapes Web API metrics at /metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        {{- with .Values.envChecksum }}
        checksum/env: {{ . | quote }}   # env Secret changes ⇒ pods are replaced
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      # Prefer spreading replicas across workers: one dead node still leaves a pod serving. 'preferred' so a 1-node kind still runs.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: {{ .Release.Name }}}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: {{ .Values.envSecret }}}}]
          env: [{name: API_SURFACE, value: {{ .Values.surface | quote }}}]   # rest | mcp: same image, different exposed surface
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # Wait 5 s before shutdown: kube-proxy has time to remove the pod from the Service, in-flight requests are not dropped.
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          # Loading the registry from MinIO takes a few seconds; liveness does not kill the pod before that.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
