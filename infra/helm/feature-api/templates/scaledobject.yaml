# Autoscale the Feature API with KEDA (same approach as the Agents): business request rate from Prometheus, excluding probes and /metrics.
{{- if .Values.autoscaling.enabled }}
# Each pod handles ~threshold requests/s; KEDA creates HPA keda-hpa-<release>. The Deployment omits replicas when enabled.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheus }}
        query: sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-.*",handler!~"/healthz|/readyz|/metrics"}[1m]))
        threshold: {{ .Values.autoscaling.threshold | quote }}
{{- end }}
