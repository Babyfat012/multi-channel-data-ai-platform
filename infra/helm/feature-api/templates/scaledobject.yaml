{{- if .Values.autoscaling.enabled }}
# Autoscale Feature API bằng KEDA (cùng cách với Agent): tốc độ request nghiệp vụ từ Prometheus, bỏ probe và /metrics.
# Mỗi pod gánh ~threshold request/giây; KEDA tạo HPA keda-hpa-<release>. Deployment không khai replicas khi bật.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}
spec:
  scaleTargetRef:
    name: {{ .Release.Name }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheus }}
        query: sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",pod=~"{{ .Release.Name }}-.*",handler!~"/healthz|/readyz|/metrics"}[1m]))
        threshold: {{ .Values.autoscaling.threshold | quote }}
{{- end }}
