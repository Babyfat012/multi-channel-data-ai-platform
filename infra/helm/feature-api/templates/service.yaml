# The release's Service: feature-api (REST) or feature-mcp (MCP /mcp/). NodePort for calls from the platform_default network.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: {{ .Release.Name }}}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
