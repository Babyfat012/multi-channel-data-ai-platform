# ClusterIP only: the ingress (feature-api, policy-api) and agentgateway (mcp-server) reach it inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
