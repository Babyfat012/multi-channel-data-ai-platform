[project]
name = "platform-generator"
version = "0.1.0"
description = "Data generator simulating a Seller's multi-channel sales data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "fsspec>=2024.6",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "s3fs>=2024.6",
    "duckdb>=1.1",
    "confluent-kafka>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "lightgbm>=4.7",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "pytest>=8.0",
    "ruff>=0.14",
    "scikit-learn>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "rag/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reference", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501: the formatter handles code; long strings/comments are wrapped by the author.
# B905: adding strict= to zip() changes behavior, so not done in bulk.
# SIM117: nested with is still readable when the inner with uses a variable of the outer with.
ignore = ["E501", "B905", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Spark scripts set sys.path/environment variables before importing project code.
"tests/spark/*" = ["E402"]
# Notebooks insert the repo root into sys.path before importing `ml.train_lib`.
"notebooks/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["generator", "spark_jobs", "scripts", "dags"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.mutmut]
paths_to_mutate = ["serving/app.py"]
tests_dir = ["serving/tests"]
pytest_add_cli_args = ["-o", "pythonpath=."]
also_copy = ["serving/tests", "rag", "feature_repo"]
