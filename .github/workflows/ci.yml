# Minimal CI (ADR-0012): ruff, block breaking contract schema changes, run pytest.
# No Docker/Spark/Cloud: Spark tests run in a separate image, outside this CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13" # matches the local machine: dataset_version hashes by Python version
      - name: Install dependencies from uv.lock
        run: uv sync --frozen
      - name: Ruff (format + lint)
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Check contract registry
        run: uv run python -m spark_jobs.lib.data_contracts check-registry --contracts-dir contracts
      - name: Pytest
        run: uv run pytest -q
