<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML + LLM Platform · System Architecture</title>
<style>
  html, body { margin: 0; height: 100%; background: #f1f3f5; font: 14px system-ui, sans-serif; color: #1e1e1e; }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #map { position: absolute; left: 0; top: 0; user-select: none; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  #map > * { display: block; width: 100%; height: auto; -webkit-user-drag: none; }
  #bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; z-index: 1;
         background: #fff; padding: 6px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #bar button, #bar a { border: 1px solid #ced4da; background: #fff; border-radius: 6px; padding: 4px 10px;
         font: inherit; color: inherit; text-decoration: none; cursor: pointer; }
  #bar button:hover, #bar a:hover { background: #f1f3f5; }
  #pct { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; bottom: 12px; left: 12px; color: #868e96; z-index: 1; }
</style>
</head>
<body>
<div id="stage"><div id="map" role="img" aria-label="ML + LLM Platform system architecture"></div></div>
<div id="bar">
  <button id="out" title="Thu nhỏ (−)">−</button>
  <span id="pct">100%</span>
  <button id="in" title="Phóng to (+)">+</button>
  <button id="fit" title="Vừa màn hình (0)">Vừa màn hình</button>
  <button id="one" title="Kích thước gốc (1)">100%</button>
  <button id="mode" title="Chuyển ảnh động / ảnh tĩnh (s)">Ảnh tĩnh</button>
  <a href="ml-llm-platform-system-architecture-excalidraw.png" download title="Tải PNG 6910 × 9064">Tải PNG</a>
</div>
<div id="hint">Bấm ô chú giải ở đáy hình để xem riêng từng luồng · cuộn chuột để zoom · kéo để di chuyển · nhấp đúp để phóng to</div>
<script>
const stage = document.getElementById('stage'), img = document.getElementById('map'), pct = document.getElementById('pct');
let s = 1, x = 0, y = 0, W = 0, H = 0;
const MIN = 0.1, MAX = 4;

// Đổi kích thước thật (không dùng transform) để trình duyệt vẽ lại SVG cho nét ở mọi mức zoom.
function draw() {
  img.style.width = W * s + 'px';
  img.style.left = x + 'px';
  img.style.top = y + 'px';
  pct.textContent = Math.round(s * 100) + '%';
}
function zoomAt(k, cx, cy) {
  const n = Math.min(MAX, Math.max(MIN, s * k));
  x = cx - (cx - x) * n / s;
  y = cy - (cy - y) * n / s;
  s = n;
  draw();
}
function fit() {
  s = Math.min((innerWidth - 24) / W, (innerHeight - 24) / H);
  x = (innerWidth - W * s) / 2;
  y = (innerHeight - H * s) / 2;
  draw();
}
const centre = k => zoomAt(k, innerWidth / 2, innerHeight / 2);

// SVG động được nhúng thẳng vào trang để bấm được ô chú giải; PNG tĩnh là cùng hình, độ phân giải gấp đôi.
const SRC = { anim: 'ml-llm-platform-system-architecture.svg', still: 'ml-llm-platform-system-architecture-excalidraw.png' };
const mode = document.getElementById('mode');
let still = new URLSearchParams(location.search).has('static'), svg = null;
async function loadSvg() {
  try {
    const r = await fetch(SRC.anim);
    if (!r.ok) throw new Error(r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'image/svg+xml');
    svg = document.importNode(doc.documentElement, true);
    svg.removeAttribute('width');
    svg.removeAttribute('height');
  } catch {
    svg = Object.assign(new Image(), { src: SRC.anim });   // file:// chặn fetch: vẫn xem được, chỉ không bấm lọc
  }
}
function setMode() {
  img.replaceChildren(still ? Object.assign(new Image(), { src: SRC.still, alt: '' }) : svg);
  mode.textContent = still ? 'Ảnh động' : 'Ảnh tĩnh';
  history.replaceState(null, '', still ? '?static' : location.pathname);
}
// Bấm một ô chú giải: chỉ nhóm đó sáng; bấm lại ô đó hoặc "Tất cả luồng" để về như cũ.
function pick(target) {
  const chip = svg && svg.contains && target.closest && target.closest('.chip');
  if (!chip) return;
  const key = [...chip.classList].find(c => /^c[A-Z]$/.test(c))?.slice(1);
  if (!key || svg.dataset.show === key) delete svg.dataset.show;
  else svg.dataset.show = key;
}
mode.onclick = () => { still = !still; setMode(); };
loadSvg().then(() => {
  [, , W, H] = (svg.getAttribute?.('viewBox') || '0 0 3455.05 4662.00').split(/[\s,]+/).map(Number);
  setMode();
  fit();
});

stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
stage.addEventListener('dblclick', e => zoomAt(2, e.clientX, e.clientY));

// Kéo bằng chuột, chụm hai ngón để zoom trên màn hình cảm ứng.
const pts = new Map();
let last = null;
let down = null;
stage.addEventListener('pointerdown', e => {
  down = pts.size ? null : e;
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); stage.classList.add('drag');
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, e);
  if (pts.size === 1) {
    x += e.clientX - prev.clientX;
    y += e.clientY - prev.clientY;
    draw();
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (last) zoomAt(d / last, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    last = d;
  }
});
const up = e => {
  pts.delete(e.pointerId); last = null;
  if (!pts.size) stage.classList.remove('drag');
  // Nhả chuột gần chỗ nhấn = bấm (không phải kéo).
  if (e.type === 'pointerup' && down && Math.hypot(e.clientX - down.clientX, e.clientY - down.clientY) < 5)
    pick(document.elementFromPoint(e.clientX, e.clientY));
  down = null;
};
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);

document.getElementById('in').onclick = () => centre(1.25);
document.getElementById('out').onclick = () => centre(0.8);
document.getElementById('fit').onclick = fit;
document.getElementById('one').onclick = () => centre(1 / s);
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') centre(1.25);
  else if (e.key === '-') centre(0.8);
  else if (e.key === '0') fit();
  else if (e.key === '1') centre(1 / s);
  else if (e.key === 's') mode.click();
});
addEventListener('resize', fit);
</script>
</body>
</html>
