# Workload inference-perf đã dùng trong lần chạy EKS 2026-11-10, cấu hình optimized, bản do công cụ llm-d-benchmark ghi lại (nguồn: infra/k8s/benchmark/llmd-inference-perf-qwen-cpu.yaml).
load:
  type: constant
  stages:
  - rate: 0.1
    duration: 60
  - rate: 0.2
    duration: 60
  - rate: 0.4
    duration: 60
  request_timeout: 120
  num_workers: 2
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: qwen2.5-1.5b-instruct
  base_url: http://qwen.llm.svc.cluster.local:8080
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
data:
  type: random
  input_distribution:
    min: 64
    max: 256
    mean: 128
    std_dev: 10
    total_count: 100
  output_distribution:
    min: 16
    max: 48
    mean: 32
    std_dev: 5
    total_count: 100
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /requests/inference-perf-1794290823-tyiab1_1
