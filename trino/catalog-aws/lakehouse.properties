# Iceberg REST catalog (Lakekeeper on EC2) + real S3 on AWS; temporary credentials from the EC2 IAM role
# (IMDSv2, hop limit 2), no access key, no custom endpoint.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:WAREHOUSE_NAME}

fs.s3.enabled=true
s3.region=${ENV:AWS_REGION}
