# Simulated source environment for the generator: MinIO (file exports) and PostgreSQL
# (another department's system). Run: cp .env.example .env && docker compose up -d
# Order: minio, postgres -> minio-init (creates buckets) -> generator-batch -> generator-load.
# Stream (Kafka) lives in its own profile: docker compose --profile stream up -d
# Spark standalone (1 master + 2 workers) is also in its own profile: docker compose --profile spark up -d
# Lakekeeper (REST catalog for Iceberg) is in the catalog profile and is pulled in by the spark profile.

name: platform

x-generator: &generator
  build: .
  image: platform-generator:optimize
  env_file: .env
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    FSSPEC_S3_ENDPOINT_URL: http://minio:9000

# Spark: all services share one image. The spark_jobs/ directory is mounted (read-only) into
# ALL THREE containers at the SAME path /opt/spark_jobs: edits on the host show up immediately, no rebuild. Runs as root so it can write to the spill volume
# (a newly created volume is owned by root); this is a dev environment on a personal machine.
x-spark: &spark
  # Must be the java17 variant: Iceberg 1.11.0 is built for Java 17 (class file 61),
  # the default image apache/spark:3.5.3 runs Java 11 (reads up to class 55) -> the job dies
  # as soon as it loads iceberg-spark-runtime, with UnsupportedClassVersionError.
  image: apache/spark:3.5.3-java17
  profiles: [spark]
  user: root
  env_file: .env
  environment:
    PYTHONPATH: /opt
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    env_file: .env
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$MINIO_BUCKET"

  postgres:
    image: postgres:15
    # Debezium reads committed changes from the WAL; keep at most four slots for the dev environment.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    env_file: .env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  generator-batch:
    <<: *generator
    depends_on:
      minio-init: {condition: service_completed_successfully}
    command: ["batch", "--config", "${GENERATOR_CONFIG}", "--output", "s3://${MINIO_BUCKET}"]

  generator-load:
    <<: *generator
    depends_on:
      generator-batch: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    command: ["load-postgres", "--source", "s3://${MINIO_BUCKET}",
              "--dsn", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"]

  # Single-node Kafka in KRaft mode (no ZooKeeper needed).
  # Inside the Compose network use kafka:9092; from the host use localhost:${KAFKA_PORT}.
  kafka:
    image: apache/kafka:3.9.1
    profiles: [stream, cdc]
    ports: ["${KAFKA_PORT:-9094}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Gap #12: by default the image writes /tmp/kraft-combined-logs (container writable layer) ⇒ recreating the container loses the topics.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  # Replay the Stream after cutoff into Kafka and write stream_manifest.json to MinIO.
  generator-stream:
    <<: *generator
    profiles: [stream]
    depends_on:
      kafka: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    command: ["stream", "--config", "${GENERATOR_CONFIG}", "--sink", "kafka", "--bootstrap", "kafka:9092",
              "--speed", "${STREAM_SPEED:-1}", "--output", "s3://${MINIO_BUCKET}"]

  # Lakekeeper: the ledger of "which Iceberg table points to which metadata file" for Spark and Flink.
  # The ledger lives in the `lakekeeper` DB of the existing postgres container, separate from the `sources` DB
  # (which stands in for another department's system) so they do not mix. The actual metadata files live on MinIO.
  # Postgres only creates DBs on first start, so this DB must be created by a separate (re-runnable) step.
  lakekeeper-db-init:
    image: postgres:15
    profiles: [catalog, spark, query]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='lakekeeper'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE lakekeeper'"

  lakekeeper-migrate: &lakekeeper
    image: quay.io/lakekeeper/catalog:v0.13.6
    profiles: [catalog, spark, query]
    depends_on:
      lakekeeper-db-init: {condition: service_completed_successfully}
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    command: ["migrate"]

  lakekeeper:
    <<: *lakekeeper
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
    environment:
      <<: *lakekeeper-env
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    command: ["serve"]
    ports: ["${LAKEKEEPER_PORT:-8181}:8181"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      retries: 20

  # The Spark master only coordinates, so it is very light. Spark UI: http://localhost:8080
  spark-master:
    <<: *spark
    depends_on:
      lakekeeper: {condition: service_healthy}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master"]
    ports: ["${SPARK_MASTER_PORT:-7077}:7077", "${SPARK_UI_PORT:-8080}:8080"]
    # /data/raw mounted read-only: the 93 GiB of data lives outside Docker volumes and does not fit in MinIO
    # on / (only ~42 GB left). Spark reads directly from disk; Iceberg tables are still written to MinIO.
    # ./out/spark-events: the Spark UI only lives while the job is running. Write the event log to the host
    # so it can be reopened in the History Server and evidence screenshots taken after the job finishes.
    volumes: [./spark_jobs:/opt/spark_jobs:ro, /data/raw:/data/raw:ro,
              /data/raw/ground-truth:/data/ground-truth:ro,
              ./out/ground-truth-bridge:/data/ground-truth-bridge:ro,
              ./out/channels-small/source-exports:/data/channels-small/source-exports:ro,
              ./out/spark-events:/spark-events,
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    mem_limit: 512m

  # Workers do the real work. Worker RAM is the number WE SET (SPARK_WORKER_MEMORY); if it runs short
  # Spark spills to disk. mem_limit is slightly higher to leave room for JVM overhead.
  # SPARK_LOCAL_DIRS points to a volume (on /), NOT /tmp, because /tmp is RAM.
  spark-worker-1: &spark-worker
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      PYTHONPATH: /opt
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_LOCAL_DIRS: /spark-local
    volumes: [spark-local-1:/spark-local, "./spark_jobs:/opt/spark_jobs:ro",
              "/data/raw:/data/raw:ro", "/data/raw/ground-truth:/data/ground-truth:ro",
              "./out/ground-truth-bridge:/data/ground-truth-bridge:ro",
              "./out/channels-small/source-exports:/data/channels-small/source-exports:ro",
              "./out/spark-events:/spark-events",
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-2560m}

  spark-worker-2:
    <<: *spark-worker
    volumes: [spark-local-2:/spark-local, "./spark_jobs:/opt/spark_jobs:ro",
              "/data/raw:/data/raw:ro", "/data/raw/ground-truth:/data/ground-truth:ro",
              "./out/ground-truth-bridge:/data/ground-truth-bridge:ro",
              "./out/channels-small/source-exports:/data/channels-small/source-exports:ro",
              "./out/spark-events:/spark-events",
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]

  # Airflow uses its own DB in the existing PostgreSQL. Only creates the DB, does not touch `sources`.
  airflow-db-init:
    image: postgres:15
    profiles: [airflow]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE airflow'"

  # A single dev container runs webserver + scheduler. SparkSubmitOperator spawns the driver here;
  # do not put the driver on spark-master (that container has only 512 MB).
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: platform-airflow:2.10.5-spark3.5.3
    profiles: [airflow]
    user: "${AIRFLOW_UID:-1000}:0"
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__FERNET_KEY_CMD: "cat /opt/airflow/.fernet_key"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      PYTHONPATH: /opt
      SPARK_LOCAL_HOSTNAME: airflow
      PLATFORM_CONTRACTS_DIR: /opt/contracts
    depends_on:
      airflow-db-init: {condition: service_completed_successfully}
    # `airflow standalone` leaves a PID file in the volume after the container stops.
    # If the stale PID is kept, the webserver exits on the next start even though the scheduler is still running.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone"]
    ports: ["${AIRFLOW_WEB_PORT:-8081}:8080"]
    volumes: [airflow-data:/opt/airflow, ./out/receipts:/opt/airflow/receipts,
              ./dags:/opt/airflow/dags:ro,
              ./scripts:/opt/platform/scripts:ro,
              ./sql:/opt/sql:ro, ./spark_jobs:/opt/spark_jobs:ro, ./contracts:/opt/contracts:ro, /data/raw:/data/raw:ro,
              ./feature_repo:/opt/feature_repo:ro, ./rag:/opt/rag/rag:ro,
              /data/raw/ground-truth:/data/ground-truth:ro,
              ./out/ground-truth-bridge:/data/ground-truth-bridge:ro,
              ./out/channels-small/source-exports:/data/channels-small/source-exports:ro,
              ./out/spark-events:/spark-events,
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    # 6g: the Spark client-mode driver of DAG v2 runs in this container with a 3g heap.
    mem_limit: 6g

  # Flink SQL reads the replayed Kafka stream to demonstrate watermarks, state and Windows.
  # Enable this profile only after DP1/DP2 finish, to keep RAM for the TaskManager.
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: platform-flink:1.20.3-kafka3.4.0
    profiles: [flink]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        rest.address: flink-jobmanager
    ports: ["${FLINK_UI_PORT:-8082}:8081"]
    volumes: [./flink_jobs:/opt/flink/jobs:ro, ./out/flink:/opt/flink/output]
    mem_limit: 1024m

  flink-taskmanager:
    image: platform-flink:1.20.3-kafka3.4.0
    profiles: [flink]
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    volumes: [./flink_jobs:/opt/flink/jobs:ro, ./out/flink:/opt/flink/output]
    mem_limit: 1280m

  # ML Platform: reads stream features Flink writes to Kafka and pushes them into Feast (Redis in kind + Parquet on MinIO).
  # Run scripts/setup/setup_kind_feature_store.sh first so Redis exists.
  feast-pusher:
    build: {context: ., dockerfile: docker/Dockerfile.feast}
    image: platform-feast:0.66.0
    profiles: [ml-stream]
    command: ["python", "push_stream_features.py"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      FEAST_S3_ENDPOINT_URL: http://minio:9000
      FEAST_REGISTRY: s3://${MINIO_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${MINIO_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${MINIO_BUCKET}/feature-store/sku_return_24h/
      FEAST_REDIS: platform-control-plane:30379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure
    mem_limit: 768m

  # ML Platform: a separate Flink 2.2 cluster running the PyFlink stream feature jobs (2 jobs: online → Redis, offline → Parquet).
  # Separate from the Data Platform's 1.20 cluster (PyFlink 1.20 cannot be installed alongside Feast 0.66). UI: http://localhost:8086.
  flink-ml-jobmanager:
    build: {context: ., dockerfile: docker/Dockerfile.flink-ml}
    image: platform-flink-ml:2.2.1
    profiles: [flink-ml]
    command: jobmanager
    environment: &flink-ml-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-ml-jobmanager
        rest.address: flink-ml-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 2560m
        taskmanager.numberOfTaskSlots: 2
        execution.checkpointing.dir: file:///opt/flink/output/checkpoints
        python.executable: python3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      FEAST_S3_ENDPOINT_URL: http://minio:9000
      FEAST_REGISTRY: s3://${MINIO_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${MINIO_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${MINIO_BUCKET}/feature-store/sku_return_24h/
      FEAST_REDIS: platform-control-plane:30379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["${FLINK_ML_UI_PORT:-8086}:8081"]
    volumes: [./out/flink-ml:/opt/flink/output]
    mem_limit: 1280m

  flink-ml-taskmanager:
    image: platform-flink-ml:2.2.1
    profiles: [flink-ml]
    command: taskmanager
    depends_on: [flink-ml-jobmanager]
    environment: *flink-ml-env
    volumes: [./out/flink-ml:/opt/flink/output]
    mem_limit: 3072m

  # ML Platform: MLflow tracking + model registry. The ledger lives in the `mlflow` DB of the existing PostgreSQL, artifacts
  # on MinIO; clients (KFP steps in kind) send artifacts through the server, so they need no S3 credentials.
  registry:
    image: registry:2.8.3
    profiles: [ml]
    ports: ["127.0.0.1:5001:5000"]
    volumes: [registry-data:/var/lib/registry]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      kind:
        aliases: [registry]
    restart: unless-stopped
    mem_limit: 128m

  mlflow-db-init:
    image: postgres:15
    profiles: [ml]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='mlflow'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE mlflow'"

  mlflow:
    build: {context: ., dockerfile: docker/Dockerfile.mlflow}
    image: platformflow:3.17.0
    profiles: [ml]
    depends_on:
      mlflow-db-init: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Disable the GenAI job queue (7 huey processes, ~1 GB RAM); only tracking + registry are used here.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "s3://${MINIO_BUCKET}/mlflow",
              "--allowed-hosts", "*", "--workers", "1"]
    ports: ["${MLFLOW_PORT:-5050}:5000"]
    restart: unless-stopped
    mem_limit: 512m

  # Centralized secret management. Server mode, file storage in a volume; init/unseal and secret loading
  # via scripts/setup/setup_vault.sh. UI: http://localhost:8200
  vault:
    image: hashicorp/vault:2.1.1
    profiles: [security]
    command: ["server"]
    environment:
      VAULT_LOCAL_CONFIG: >-
        {"storage": {"file": {"path": "/vault/file"}},
         "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
         "ui": true, "disable_mlock": true, "api_addr": "http://vault:8200"}
    ports: ["${VAULT_PORT:-8200}:8200"]
    volumes: [vault-data:/vault/file]
    mem_limit: 256m

  # Jenkins CI/CD. network_mode host: builds can reach Vault, Flink REST and the kind API
  # as on the host. JENKINS_HOME is mounted at the SAME host path so bind mounts from `docker compose` in the
  # workspace resolve correctly. Start with scripts/setup/setup_jenkins.sh (fetches secrets from Vault). UI :8090
  jenkins:
    build: {context: ., dockerfile: docker/Dockerfile.jenkins}
    image: platform-jenkins:2.580.1
    profiles: [ci]
    network_mode: host
    group_add: ["${DOCKER_GID:-973}"]
    environment:
      JENKINS_HOME: ${PWD}/out/jenkins_home
      JENKINS_OPTS: --httpPort=8090
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
      COMPOSE_PROJECT_NAME: platform
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      VAULT_CI_TOKEN: ${VAULT_CI_TOKEN:-}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock",
              "${PWD}:/repo:ro",
              "${PWD}/out/jenkins_home:${PWD}/out/jenkins_home",
              "./infra/jenkins/jenkins.yaml:/var/jenkins_casc/jenkins.yaml:ro",
              "./out/jenkins/kubeconfig:/run/secrets/kubeconfig:ro"]
    mem_limit: 1g

  # Trino federation: one SQL endpoint for Iceberg on MinIO and PostgreSQL.
  # Run in the separate `query` profile to limit RAM contention with Spark and Flink.
  trino:
    image: trinodb/trino:483
    profiles: [query]
    depends_on:
      lakekeeper: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${TRINO_PORT:-8083}:8080"]
    volumes: [./trino/catalog:/etc/trino/catalog:ro]
    mem_limit: 2g

  # CDC for the Walmart source table. Kafka Connect uses its own internal topics to keep
  # config and offsets across container restarts.
  debezium-connect:
    image: quay.io/debezium/connect:3.4
    profiles: [cdc]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: platform-cdc-connect
      CONFIG_STORAGE_TOPIC: platform_cdc_connect_configs
      OFFSET_STORAGE_TOPIC: platform_cdc_connect_offsets
      STATUS_STORAGE_TOPIC: platform_cdc_connect_statuses
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports: ["${DEBEZIUM_PORT:-8084}:8083"]
    mem_limit: 1280m

  # UI for browsing Kafka topics (including the CDC topics written by Debezium) to capture evidence.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [cdc]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["${KAFKA_UI_PORT:-8085}:8080"]
    mem_limit: 640m

volumes:
  spark-local-1:
  spark-local-2:
  minio-data:
  postgres-data:
  kafka-data:
  airflow-data:
  vault-data:
  registry-data:

networks:
  kind:
    external: true
    name: kind
