# Feast config. Environment variables are passed in by the DAG/pod, so the same file works
# locally (MinIO + Redis in kind) and on GCP (gs:// + Redis on GKE).
project: platform
provider: local
registry: ${FEAST_REGISTRY}
offline_store:
  type: file
online_store:
  type: redis
  connection_string: ${FEAST_REDIS}
entity_key_serialization_version: 3
