# Local hooks (ADR-0012): ruff + early warning on breaking contract edits. Not a CI replacement —
# `git commit --no-verify` can skip these hooks. Install: `uvx pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: check-registry
        name: Check contract registry
        entry: uv run python -m spark_jobs.lib.data_contracts check-registry --contracts-dir contracts
        language: system
        pass_filenames: false
        files: ^(contracts/|spark_jobs/lib/data_contracts/)
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
