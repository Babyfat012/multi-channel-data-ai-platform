# Run Kafka + Flink (Stream) or Kafka + Debezium (CDC dp1_cdc) on EC2, time-shared with Spark.
# Layer on top of the two base files:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.aws-stream.yml \
#     --profile stream --profile flink up -d kafka flink-jobmanager flink-taskmanager
#   CDC: ... --profile cdc up -d kafka debezium-connect
# Ports open on loopback only; view the UIs via SSM port forwarding. Flink output lives on the data EBS; the directory must
# be owned by the image's flink user: sudo install -d -o 9999 -g 9999 /mnt/platform-data/flink
# Kafka (gap #5 #12) writes topics on EBS, directory owned by appuser: sudo install -d -o 1000 -g 1000 /mnt/platform-data/kafka
# Stream feature A (phase 4): ... --profile stream --profile flink --profile ml-stream up -d kafka flink-jobmanager \
#   flink-taskmanager feast-pusher (pusher: build it on EC2 first, `... build feast-pusher`).
services:
  kafka:
    profiles: !override [stream, cdc]
    scale: 1
    cpus: "1"
    mem_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes: !override
      - /mnt/platform-data/kafka:/var/lib/kafka/data
  flink-jobmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${FLINK_UI_PORT:-8082}:8081"
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  flink-taskmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "2"
    # The base file's 1 GB (laptop size) runs out of heap on stream A checkpoints: dedup state of ~401k Returns + 24h HOP window.
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 6
    mem_limit: 4608m
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  # Debezium reads the WAL of the EC2 Postgres (wal_level=logical from the base file) and writes topic platform_cdc.walmart.orders.
  debezium-connect:
    profiles: !override [cdc]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${DEBEZIUM_PORT:-8084}:8083"
  # Feast/Kafka tooling image: replays Returns (replay_return_events.py) into Kafka for the PyFlink job.
  # S3 via the EC2 IAM role: no keys, no MinIO endpoint.
  feast-pusher:
    cpus: "0.5"
    depends_on:
      kafka: {condition: service_healthy}
    environment: !override
      AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
      FEAST_REGISTRY: s3://${LAKEHOUSE_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_return_24h/
      FEAST_REDIS: ${PLATFORM_FEAST_REDIS:?PLATFORM_FEAST_REDIS_required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Cluster Flink 2.2 cho 2 job PyFlink stream feature: online → Redis EKS (NodePort), offline → Parquet S3 (IAM role).
  # Checkpoint directory owned by the flink user: sudo install -d -o 9999 -g 9999 /mnt/platform-data/flink-ml
  flink-ml-jobmanager:
    scale: 1
    cpus: "1"
    environment: !override &flink-ml-aws-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-ml-jobmanager
        rest.address: flink-ml-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 3072m
        taskmanager.numberOfTaskSlots: 2
        execution.checkpointing.dir: file:///opt/flink/output/checkpoints
        python.executable: python3
      AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
      FEAST_REGISTRY: s3://${LAKEHOUSE_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_return_24h/
      FEAST_REDIS: ${PLATFORM_FEAST_REDIS:?PLATFORM_FEAST_REDIS_required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: !override
      - "127.0.0.1:${FLINK_ML_UI_PORT:-8086}:8081"
    volumes: !override
      - /mnt/platform-data/flink-ml:/opt/flink/output
  flink-ml-taskmanager:
    scale: 1
    cpus: "3"   # the Python job uses ~3 cores while replaying (measured 09/11); Kafka and the JobManager are nearly idle
    environment: *flink-ml-aws-env
    mem_limit: 3584m
    volumes: !override
      - /mnt/platform-data/flink-ml:/opt/flink/output
