# Overlay after docker-compose.aws.yml, only for VMs with at least 8 vCPU/32 GiB; opens no ports and adds no services.
# Selected via Ansible aws_runtime_profile=performance; check real metrics before enabling additional stacks.
services:
  spark-worker-1:
    cpus: "2"
    mem_limit: 6g
    environment:
      SPARK_WORKER_MEMORY: 5g
      SPARK_WORKER_CORES: "2"
  spark-worker-2:
    cpus: "2"
    mem_limit: 6g
    environment:
      SPARK_WORKER_MEMORY: 5g
      SPARK_WORKER_CORES: "2"
  airflow:
    cpus: "2"
    mem_limit: 6g
    environment:
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
