# AWS overlay (EC2 t3.xlarge 16 GiB): Compose >= 2.24.4 to fully replace ports/volumes with !override.
# Only starts catalog, spark, airflow; does not enable the disabled-aws profile. No access keys:
# Spark, Iceberg and Lakekeeper get temporary credentials from the IAM role via IMDSv2 (hop limit 2).
x-s3-env: &s3-env
  PLATFORM_STORAGE: s3
  AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
  RAW_BUCKET: ${RAW_BUCKET:?RAW_BUCKET_required}
  LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?LAKEHOUSE_BUCKET_required}
  PLATFORM_CONTRACTS_DIR: /opt/contracts
services:
  minio:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  minio-init:
    profiles: !override [disabled-aws]
    scale: 0
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    cpus: "0.5"
    mem_limit: 2g
    volumes: !override
      - /mnt/platform-data/postgres:/var/lib/postgresql/data
  generator-batch:
    profiles: !override [disabled-aws]
    scale: 0
  generator-load:
    profiles: !override [disabled-aws]
    scale: 0
  kafka:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
  generator-stream:
    profiles: !override [disabled-aws]
    scale: 0
  lakekeeper-db-init:
    cpus: "0.1"
    mem_limit: 128m
  lakekeeper-migrate:
    cpus: "0.1"
    mem_limit: 256m
    environment:
      LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS: "true"
  lakekeeper:
    ports: !override
      - "127.0.0.1:${LAKEKEEPER_PORT:-8181}:8181"
    cpus: "0.25"
    mem_limit: 512m
    environment:
      LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS: "true"
  spark-master:
    ports: !override
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
      - "127.0.0.1:${SPARK_UI_PORT:-8080}:8080"
    cpus: "0.25"
    mem_limit: 512m
    image: platform-airflow:2.10.5-spark3.5.3
    # Airflow image has an /entrypoint that turns any unknown command into `airflow <command>` => exit 2.
    # Keep dumb-init (PID 1 forwards stop signals), drop /entrypoint to run spark-class directly.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    environment: !override
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
  spark-worker-1:
    cpus: "2"
    mem_limit: 3500m
    image: platform-airflow:2.10.5-spark3.5.3
    # Airflow image has an /entrypoint that turns any unknown command into `airflow <command>` => exit 2.
    # Keep dumb-init (PID 1 forwards stop signals), drop /entrypoint to run spark-class directly.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      # Must fit within mem_limit 3500m: worker JVM (~0.5 GB) + per-executor overhead (≥384 MB).
      # 3g once gave 2 executors of 1536m/worker ⇒ Docker OOM-kill (exit 137, dp3_walmart_labels 2026-10-28).
      SPARK_WORKER_MEMORY: 2560m
      SPARK_WORKER_CORES: "2"
      # Each app copies ~400 MB of jars into $SPARK_HOME/work inside the container (29 GB root disk); on 2026-10-27 the disk filled after ~19 apps.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=1800
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/spark-worker-1:/spark-local
  spark-worker-2:
    cpus: "2"
    mem_limit: 3500m
    image: platform-airflow:2.10.5-spark3.5.3
    # Airflow image has an /entrypoint that turns any unknown command into `airflow <command>` => exit 2.
    # Keep dumb-init (PID 1 forwards stop signals), drop /entrypoint to run spark-class directly.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      # Must fit within mem_limit 3500m: worker JVM (~0.5 GB) + per-executor overhead (≥384 MB).
      # 3g once gave 2 executors of 1536m/worker ⇒ Docker OOM-kill (exit 137, dp3_walmart_labels 2026-10-28).
      SPARK_WORKER_MEMORY: 2560m
      SPARK_WORKER_CORES: "2"
      # Each app copies ~400 MB of jars into $SPARK_HOME/work inside the container (29 GB root disk); on 2026-10-27 the disk filled after ~19 apps.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=1800
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/spark-worker-2:/spark-local
  airflow-db-init:
    cpus: "0.1"
    mem_limit: 128m
  airflow:
    ports: !override
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8081}:8080"
    cpus: "1"
    mem_limit: 4g
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      AIRFLOW_VAR_PLATFORM_SPARK_PACKAGES: ${PLATFORM_SPARK_PACKAGES_AWS:?packages_required}
      AIRFLOW_VAR_PLATFORM_ORDER_LIFECYCLE_SOURCE_ROOT: s3a://${RAW_BUCKET}/order_lifecycle/${PLATFORM_DATASET_NAME:-fixture}
      AIRFLOW_VAR_PLATFORM_ORDER_LIFECYCLE_CUTOFF: ${PLATFORM_ORDER_LIFECYCLE_CUTOFF:-2026-06-01T00:00:00.000000Z}
      # DAG v1 (dp1 -> dp2 -> dp3) reads the 100 GB dataset on S3, all 180 days (window 0 = load everything).
      AIRFLOW_VAR_PLATFORM_DP1_AMAZON_SOURCE: s3a://${RAW_BUCKET}/order_snapshots/source-exports/channel=amazon/dataset=orders
      AIRFLOW_VAR_PLATFORM_DP1_EXTRA_SOURCE_ROOT: s3a://${RAW_BUCKET}/order_snapshots/source-exports
      AIRFLOW_VAR_PLATFORM_DP1_AMAZON_WINDOW_DAYS: "0"
      # dp3_return_labels: the label answer key, the 4-channel key ledger and the join keys live on S3 (executors have no local /data).
      AIRFLOW_VAR_PLATFORM_DP3_GROUND_TRUTH: s3a://${RAW_BUCKET}/order_snapshots/ground-truth
      AIRFLOW_VAR_PLATFORM_DP3_WALMART_KEYS: s3a://${RAW_BUCKET}/order_snapshots/ground-truth-bridge/walmart-keys.parquet
      # ML: Feast reads/writes real S3 via the IAM role; online Redis is a NodePort on EKS; cutoff of Gold A.
      AIRFLOW_VAR_PLATFORM_FEAST_ROOT: s3://${LAKEHOUSE_BUCKET}/feature-store
      AIRFLOW_VAR_PLATFORM_FEAST_REDIS: ${PLATFORM_FEAST_REDIS:-}
      # RAG (phase 4): documents + chunks on the S3 lakehouse; pgvector is a NodePort on an EKS node (Ansible -e rag_pg).
      AIRFLOW_VAR_PLATFORM_RAG_ROOT: s3://${LAKEHOUSE_BUCKET}/rag
      AIRFLOW_CONN_PLATFORM_RAG_PG: ${PLATFORM_RAG_PG_CONN:?PLATFORM_RAG_PG_CONN_required}
      AIRFLOW_VAR_PLATFORM_ML_CUTOFF: "2026-06-30T00:00:00Z"
      # The Walmart task of DAG v1 reads PostgreSQL over JDBC directly in the Airflow driver.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # spark-submit reads this variable when the DAG does not set executor memory; the 1g default is too tight for Silver at 100 GB.
      SPARK_EXECUTOR_MEMORY: 2g
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      # Feast definitions for ml_feature_materialize (feast apply/materialize run in this container).
      - ./feature_repo:/opt/feature_repo:ro
      - ./rag:/opt/rag/rag:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/airflow:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./scripts:/opt/platform/scripts:ro
      - ./infra/aws/ansible:/opt/aws-runtime:ro
  flink-jobmanager:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${FLINK_UI_PORT:-8082}:8081"
  flink-taskmanager:
    profiles: !override [disabled-aws]
    scale: 0
  # Federated Trino (Novel #1): Iceberg on S3 via the IAM role + EC2 PostgreSQL; enable only when measuring
  # (--profile query), nghe loopback, xem UI qua tunnel 8083.
  trino:
    profiles: !override [query]
    cpus: "1"
    mem_limit: 3g
    depends_on: !override
      lakekeeper: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment: !override
      <<: *s3-env
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: !override
      - ./trino/catalog-aws:/etc/trino/catalog:ro
    ports: !override
      - "127.0.0.1:${TRINO_PORT:-8083}:8080"
  debezium-connect:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${DEBEZIUM_PORT:-8084}:8083"
  kafka-ui:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
  # MLflow on EC2: ledger in the mlflow DB of the EC2 Postgres, artifacts on the S3 lakehouse via the IAM role (the server
  # proxies artifacts, so KFP pods on EKS need no S3 permissions). Listens on loopback (tunnel) + the private VPC IP for
  # EKS (the SG only opens 5050 from the cluster SG), not 0.0.0.0.
  mlflow:
    cpus: "0.25"
    mem_limit: 512m
    depends_on: !override
      mlflow-db-init: {condition: service_completed_successfully}
    environment: !override
      <<: *s3-env
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: !override ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "s3://${LAKEHOUSE_BUCKET}/mlflow",
              "--allowed-hosts", "*", "--workers", "1"]
    ports: !override
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:${MLFLOW_PORT:-5050}:5000"
  # Vault on EC2 (centralized secrets: UI passwords, tokens…). Loopback only; laptop scripts go through tunnel
  # 8200; data on EBS so EC2 stop/start loses nothing (port 8200 is already in data_service_ports).
  vault:
    cpus: "0.25"
    mem_limit: 256m
    ports: !override
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    volumes: !override
      - /mnt/platform-data/vault:/vault/file
  # Exporters for Prometheus on EKS (pull): listen on the private VPC IP, the SG only opens 9100/9187 from the cluster SG
  # (data_service_ports). Disk-full (#20) and WAL slot (#17) alerts — rules in prometheus-values-aws.yaml.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    cpus: "0.1"
    mem_limit: 64m
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:9100:9100"
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    cpus: "0.1"
    mem_limit: 64m
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:9187:9187"
  # Jenkins on EC2 (phase 5): builds in place, deploys compose in place, pushes to ECR + deploys to EKS via the EC2 IAM role.
  # Listens on loopback only (host network) ⇒ UI via tunnel 8090. Jobs get code from a git bundle (rsync does not carry .git).
  jenkins:
    environment:
      JENKINS_OPTS: --httpPort=8090 --httpListenAddress=127.0.0.1
      # Plain path, not `file://`: git only recognizes a bundle file when the remote is a path (file:// requires a repo directory).
      CI_GIT_REMOTE: /repo/out/platform.bundle
      AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
    mem_limit: 1536m
