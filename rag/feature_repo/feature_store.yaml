# Second Feast, dedicated to RAG: Postgres + pgvector online store (vector search), unlike the SKU Feast which uses Redis.
# Environment variables are passed in by the DAG/pod; Postgres runs in kind (ns rag).
project: platform_rag
provider: local
registry: ${FEAST_RAG_REGISTRY}
offline_store:
  type: file
online_store:
  type: postgres
  host: ${RAG_PG_HOST}
  port: ${RAG_PG_PORT}
  database: rag
  db_schema: public
  user: ${RAG_PG_USER}
  password: ${RAG_PG_PASSWORD}
  sslmode: disable          # local pgvector in kind has no TLS; switch to require on Cloud SQL
  vector_enabled: true
entity_key_serialization_version: 3
